<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Thi thử Cognitive Test</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#F4F7FB; --grid:#E2EAF3; --card:#FFFFFF; --line:#C8D4E2;
  --ink:#1D3F8F; --ink-soft:#4C67AE; --text:#232830; --muted:#5B6574;
  --mark:#FFE36E; --mark-text:#232830; --ok:#1F7A4A; --bad:#BF3530; --ok-bg:#E3F3EA; --bad-bg:#FBE6E4;
  --display:"Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --body:"Source Sans 3", "Segoe UI", system-ui, -apple-system, sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#11171F; --grid:#1A222D; --card:#18202A; --line:#2C3847;
    --ink:#91B1FF; --ink-soft:#6F8FD9; --text:#E5E9EF; --muted:#9AA5B4;
    --mark:#E9C84A; --mark-text:#17140A; --ok:#53C98E; --bad:#F27A70; --ok-bg:#16301F; --bad-bg:#3A1C1A;
  }
}
:root[data-theme="dark"]{
  --paper:#11171F; --grid:#1A222D; --card:#18202A; --line:#2C3847;
  --ink:#91B1FF; --ink-soft:#6F8FD9; --text:#E5E9EF; --muted:#9AA5B4;
  --mark:#E9C84A; --mark-text:#17140A; --ok:#53C98E; --bad:#F27A70; --ok-bg:#16301F; --bad-bg:#3A1C1A;
}
*,*::before,*::after{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{min-height:100%}
body{
  margin:0; color:var(--text); font-family:var(--body); font-size:17px; line-height:1.55;
  background-color:var(--paper);
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:24px 24px;
}
.wrap{max-width:860px; margin:0 auto; padding:28px 20px 64px}
h1,h2,h3{font-family:var(--display); color:var(--ink); margin:0; line-height:1.1}
h1{font-size:clamp(2.2rem,6vw,3.6rem); font-weight:800; letter-spacing:-0.02em}
h2{font-size:1.6rem; font-weight:700}
h3{font-size:1.15rem; font-weight:700}
p{margin:0 0 .8em}
.lead{font-size:1.15rem; color:var(--muted); max-width:60ch; margin-top:14px}
button{font:inherit; cursor:pointer}
:focus-visible{outline:3px solid var(--ink); outline-offset:3px}
.btn{border:2px solid var(--ink); background:var(--ink); color:var(--card); padding:12px 22px; border-radius:10px; font-weight:700; font-size:1rem}
.btn:hover{filter:brightness(1.08)}
.btn:disabled{opacity:.35; cursor:not-allowed}
.btn.ghost{background:transparent; color:var(--ink)}
.btn.small{padding:7px 14px; font-size:.92rem}
.sheet{background:var(--card); border:1.5px solid var(--line); border-radius:14px; padding:24px}
.muted{color:var(--muted)}

/* Home */
.hero{padding:24px 0 30px}
.levels{display:flex; flex-wrap:wrap; gap:8px; margin:10px 0 0}
.levels button{border:2px solid var(--line); background:var(--card); color:var(--text); border-radius:999px; padding:8px 16px; font-weight:600}
.levels button[aria-pressed="true"]{border-color:var(--ink); background:var(--mark); color:var(--mark-text)}
.structure{width:100%; border-collapse:collapse; margin:6px 0 20px}
.structure td{padding:12px 6px; border-bottom:1px solid var(--line); vertical-align:middle}
.structure tr:last-child td{border-bottom:0}
.structure .n{font-family:var(--display); font-weight:800; color:var(--ink-soft); width:34px; font-size:1.2rem}
.structure .name{font-weight:700}
.structure .vi{display:block; color:var(--muted); font-size:.92rem; font-weight:400}
.structure .meta{color:var(--muted); white-space:nowrap; text-align:right; font-variant-numeric:tabular-nums}
.structure .act{text-align:right; width:1%}
.row{display:flex; flex-wrap:wrap; gap:12px; align-items:center}
.section-gap{margin-top:28px}
.notes{margin:0; padding-left:1.1em; color:var(--muted)}
.notes li{margin:4px 0}
.hist{width:100%; border-collapse:collapse; font-size:.95rem; font-variant-numeric:tabular-nums}
.hist td{padding:6px 4px; border-bottom:1px dashed var(--line)}

/* Test screen */
.bar{display:flex; justify-content:space-between; align-items:flex-end; gap:16px; padding-bottom:12px; border-bottom:2px solid var(--ink)}
.bar .sec{font-family:var(--display); font-weight:700; color:var(--ink); font-size:1.15rem}
.bar .count{color:var(--muted); font-variant-numeric:tabular-nums}
.timer{font-family:var(--display); font-weight:800; font-size:clamp(2.4rem,8vw,3.6rem); line-height:.9; color:var(--ink); font-variant-numeric:tabular-nums; letter-spacing:-0.02em}
.timer.low{color:var(--bad)}
.progress{height:4px; background:var(--line); margin-top:-2px}
.progress i{display:block; height:100%; background:var(--ink-soft); transition:width .3s}
.qbody{padding:26px 0 10px}
.tag{display:inline-block; font-size:.85rem; color:var(--muted); border:1px solid var(--line); border-radius:6px; padding:1px 8px; margin-bottom:12px}
.qtext{font-size:1.2rem; font-weight:600; margin-bottom:18px; max-width:68ch}
.passage{background:var(--card); border-left:4px solid var(--ink); padding:16px 18px; border-radius:0 10px 10px 0; margin-bottom:18px; max-width:72ch}
.stmt{font-size:1.15rem; font-weight:700; margin-bottom:16px; max-width:68ch}
.opts{display:grid; gap:10px; max-width:640px}
.opt{display:flex; gap:12px; align-items:center; text-align:left; width:100%; background:var(--card); color:var(--text); border:2px solid var(--line); border-radius:10px; padding:12px 14px}
.opt .k{flex:none; width:28px; height:28px; border-radius:50%; border:2px solid var(--ink-soft); display:grid; place-items:center; font-weight:700; color:var(--ink); font-size:.9rem}
.opt:hover{border-color:var(--ink-soft)}
.opt[aria-checked="true"]{border-color:var(--ink); background:linear-gradient(100deg,transparent 0 6px,var(--mark) 6px calc(100% - 4px),transparent calc(100% - 4px)); color:var(--mark-text)}
.opt[aria-checked="true"] .k{background:var(--ink); color:var(--card); border-color:var(--ink)}
table.data{border-collapse:collapse; margin:0 0 18px; font-variant-numeric:tabular-nums; background:var(--card)}
table.data th,table.data td{border:1px solid var(--line); padding:7px 14px; text-align:right}
table.data th:first-child,table.data td:first-child{text-align:left}
table.data th{color:var(--ink); font-weight:700}
.tablewrap{overflow-x:auto; max-width:100%}
.seq{display:grid; grid-template-columns:repeat(5,minmax(0,1fr)); gap:8px; max-width:520px; margin-bottom:22px}
.mgrid{display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:8px; max-width:330px; margin-bottom:22px}
.mini .mgrid{max-width:230px; margin-bottom:8px}
.panel{background:var(--card); border:1.5px solid var(--line); border-radius:8px; color:var(--text); aspect-ratio:1; display:grid; place-items:center}
.panel svg{width:100%; height:100%; display:block}
.panel.q{border-style:dashed; border-color:var(--ink-soft); font-family:var(--display); font-weight:800; font-size:2rem; color:var(--ink-soft)}
.aopts{display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:10px; max-width:520px}
.aopt{background:var(--card); border:2px solid var(--line); border-radius:10px; padding:6px; color:var(--text); display:flex; flex-direction:column; align-items:center; gap:2px}
.aopt .k{font-weight:700; color:var(--ink); font-size:.95rem}
.aopt .panel{border:0; width:100%}
.aopt[aria-checked="true"]{border-color:var(--ink); background:var(--mark); color:var(--mark-text)}
.aopt[aria-checked="true"] .panel{background:transparent; color:var(--mark-text)}
.foot{display:flex; justify-content:space-between; align-items:center; gap:12px; padding-top:22px; margin-top:18px; border-top:1px solid var(--line)}
.kbd{font-size:.85rem; color:var(--muted)}

/* Results */
.score{font-family:var(--display); font-weight:800; font-size:clamp(3.5rem,14vw,6rem); color:var(--ink); line-height:1; letter-spacing:-0.03em; font-variant-numeric:tabular-nums}
.secres{display:grid; grid-template-columns:1fr auto; gap:4px 16px; align-items:baseline; padding:12px 0; border-bottom:1px solid var(--line)}
.secres .meter{grid-column:1/-1; height:8px; background:var(--line); border-radius:4px; overflow:hidden}
.secres .meter i{display:block; height:100%; background:var(--ink)}
details.review{border-top:1px solid var(--line); padding:10px 0}
details.review summary{cursor:pointer; font-weight:700; color:var(--ink); font-family:var(--display); font-size:1.1rem}
.ritem{padding:14px 0; border-bottom:1px dashed var(--line)}
.ritem:last-child{border-bottom:0}
.ritem .res{font-weight:700}
.ritem .res.ok{color:var(--ok)} .ritem .res.bad{color:var(--bad)}
.ritem .exp{background:var(--paper); border-radius:8px; padding:10px 12px; margin-top:8px; font-size:.97rem}
.mini .seq{max-width:340px; margin-bottom:8px}
.mini .panel.q{font-size:1.2rem}
.mini .passage{font-size:.95rem; padding:10px 12px}
/* Result detail */
.statgrid{display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:10px; margin-top:16px}
.stat{border:1.5px solid var(--line); border-radius:10px; padding:10px 12px; background:var(--card)}
.stat b{display:block; font-family:var(--display); font-size:1.4rem; color:var(--ink); font-variant-numeric:tabular-nums}
.stat span{font-size:.9rem; color:var(--muted)}
.controls{position:sticky; top:env(safe-area-inset-top,0px); z-index:5; background:var(--paper); padding:12px 0 10px; border-bottom:1px solid var(--line); margin-top:26px}
.fab{position:fixed; right:max(16px, env(safe-area-inset-right)); bottom:max(16px, env(safe-area-inset-bottom)); z-index:20; border:2px solid var(--ink); background:var(--ink); color:var(--card); border-radius:999px; padding:12px 20px; font-weight:700; font-size:1rem; box-shadow:0 6px 20px rgba(0,0,0,.22)}
.fab:hover{filter:brightness(1.08)}
.fab:focus-visible{outline:3px solid var(--mark); outline-offset:2px}
body.has-fab .wrap{padding-bottom:96px}
.chips{display:flex; gap:6px; overflow-x:auto; padding-bottom:4px}
.chips button{flex:none; border:1.5px solid var(--line); background:var(--card); color:var(--text); border-radius:999px; padding:5px 12px; font-size:.92rem; font-weight:600}
.chips button[aria-pressed="true"]{border-color:var(--ink); background:var(--ink); color:var(--card)}
.chips + .chips{margin-top:6px}
.navgrid{display:flex; flex-wrap:wrap; gap:5px; margin:14px 0 4px}
.navgrid button{width:32px; height:32px; border-radius:6px; border:1.5px solid var(--line); background:var(--card); color:var(--text); font-size:.82rem; font-weight:700; font-variant-numeric:tabular-nums; padding:0}
.navgrid .st-ok{background:var(--ok-bg); border-color:var(--ok); color:var(--ok)}
.navgrid .st-bad{background:var(--bad-bg); border-color:var(--bad); color:var(--bad)}
.navgrid .st-skip{border-style:dashed; color:var(--muted)}
.qcard{background:var(--card); border:1.5px solid var(--line); border-left:5px solid var(--line); border-radius:10px; padding:16px 18px; margin:14px 0; scroll-margin-top:150px}
.qcard.st-ok{border-left-color:var(--ok)} .qcard.st-bad{border-left-color:var(--bad)} .qcard.st-skip{border-left-style:dashed}
.qhead{display:flex; justify-content:space-between; gap:10px; flex-wrap:wrap; font-size:.92rem; color:var(--muted); margin-bottom:10px}
.qhead .res{font-weight:700} .res.ok{color:var(--ok)} .res.bad{color:var(--bad)} .res.skip{color:var(--muted)}
.ro{list-style:none; margin:10px 0 0; padding:0; display:grid; gap:6px}
.ro li{display:flex; gap:10px; align-items:center; border:1.5px solid var(--line); border-radius:8px; padding:7px 10px}
.ro .k{flex:none; font-weight:700; color:var(--ink); width:18px}
.ro em{margin-left:auto; font-style:normal; font-size:.82rem; font-weight:700; white-space:nowrap}
.ro .is-ans{border-color:var(--ok); background:var(--ok-bg)} .ro .is-ans em{color:var(--ok)}
.ro .is-wrong{border-color:var(--bad); background:var(--bad-bg)} .ro .is-wrong em{color:var(--bad)}
.ro.abs{grid-template-columns:repeat(4,minmax(0,1fr)); max-width:420px}
.ro.abs li{flex-direction:column; padding:4px; gap:0}
.ro.abs li .panel{border:0; width:100%; background:transparent}
.ro.abs em{margin:0; font-size:.72rem}
.why{margin-top:12px; padding:10px 12px; background:var(--paper); border-radius:8px}
.why p{margin:0}
.why .tip{margin-top:6px; font-size:.92rem; color:var(--muted)}
.empty{padding:28px 0; color:var(--muted)}
.trends{display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:10px; margin-top:16px}
.trend{border:1.5px solid var(--line); border-radius:10px; padding:10px 12px; background:var(--card); display:grid; grid-template-columns:1fr auto; gap:2px 12px; align-items:center}
.trend b{font-size:.98rem}
.trend .big{font-family:var(--display); font-size:1.4rem; color:var(--ink); font-variant-numeric:tabular-nums; text-align:right}
.trend .muted{font-size:.88rem; grid-column:1/-1}
.trend .delta{font-size:.88rem; font-weight:700}
.delta.up{color:var(--ok)} .delta.down{color:var(--bad)}
.spark{width:100%; max-width:220px; height:34px; grid-column:1/-1; display:block}
.spark line{stroke:var(--line); stroke-dasharray:3 3}
.spark polyline{fill:none; stroke:var(--ink); stroke-width:2; stroke-linejoin:round; stroke-linecap:round}
.spark circle{fill:var(--ink)}
.secmini{font-size:.86rem; color:var(--muted); font-variant-numeric:tabular-nums}
.hist .acts{white-space:nowrap; text-align:right; width:1%}
.hist .acts .btn + .btn{margin-left:6px}
.namefield{display:grid; gap:6px; margin-bottom:18px; max-width:380px}
.namefield span{font-weight:700; color:var(--ink)}
.namefield input{font:inherit; color:var(--text); background:var(--card); border:2px solid var(--line); border-radius:10px; padding:10px 12px}
.namefield input:focus{outline:none; border-color:var(--ink)}
.namefield input[aria-invalid="true"]{border-color:var(--bad)}
.namefield .err{color:var(--bad); font-size:.92rem}
.sheet.resume{border:2px solid var(--ink); margin-bottom:18px}
.sheet.resume h3{margin-bottom:4px}
a{color:var(--ink); text-underline-offset:2px}
.vlist{margin:12px 0 0; padding-left:1.3em} .vlist li{margin:10px 0} .vlist p{margin:0} .vlist .muted{margin-top:3px; font-size:.95rem}
.vans{display:inline-block; font-size:.82rem; font-weight:700; border-radius:6px; padding:1px 8px; margin-left:4px; white-space:nowrap}
.vans.v-t{background:var(--ok-bg); color:var(--ok)} .vans.v-f{background:var(--bad-bg); color:var(--bad)} .vans.v-c{background:var(--grid); color:var(--ink)}
.gsec{margin-top:34px; scroll-margin-top:70px}
.gsec h2{font-size:1.7rem}
.gintro{max-width:68ch; margin:12px 0 16px}
.gsteps{margin:8px 0 0; padding-left:1.3em} .gsteps li{margin:6px 0}
.gtoc{columns:2; column-gap:24px; margin:8px 0 0; padding-left:1.2em} .gtoc li{margin:3px 0}
.gtype{background:var(--card); border:1.5px solid var(--line); border-radius:14px; padding:18px 20px; margin-top:16px; scroll-margin-top:70px}
.gtype h4{font-family:var(--display); font-size:1.15rem; color:var(--ink); display:flex; gap:10px; align-items:center; margin:0 0 6px}
.gnum{flex:none; width:28px; height:28px; border-radius:50%; background:var(--ink); color:var(--card); display:grid; place-items:center; font-size:.9rem}
.gtype > p{margin:0 0 10px; max-width:72ch}
.gex,.gsol{border-top:1px dashed var(--line); padding-top:12px; margin-top:12px}
.gex p{margin:0 0 6px}
.glabel{display:inline-block; font-size:.78rem; font-weight:700; letter-spacing:.06em; text-transform:uppercase; color:var(--muted); margin-bottom:8px}
.gsol ol{margin:0; padding-left:1.3em} .gsol li{margin:4px 0}
.gtrap{background:var(--bad-bg); border-radius:8px; padding:10px 12px; margin:12px 0 0}
@media (max-width:560px){.gtoc{columns:1} .gtype{padding:14px}}
.btn.danger{border-color:var(--bad); color:var(--bad)}
@media (max-width:560px){.trends{grid-template-columns:minmax(0,1fr)} .hist .secmini{display:none} .hist td{font-size:.9rem} .hist .acts .btn{display:block; width:100%; padding:6px 10px} .hist .acts .btn + .btn{margin:6px 0 0}}
@media (max-width:560px){.foot{flex-wrap:wrap} .foot .kbd{display:none} .foot #ok{flex:1 0 100%; order:-1}}
.attempts td{padding:9px 4px; border-bottom:1px dashed var(--line); vertical-align:middle}
@media (max-width:560px){.statgrid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:560px){
  .wrap{padding:18px 14px 48px}
  .structure .meta{font-size:.85rem}
  .aopts{gap:6px}
}
@media (prefers-reduced-motion: reduce){ *{transition:none!important} }
</style>

<body>
<main class="wrap" id="app" aria-live="polite"></main>
<button class="fab" id="fabHome" data-home hidden>⌂ Trang chính</button>

<script>
/* ---------- helpers ---------- */
const R=(a,b)=>Math.floor(Math.random()*(b-a+1))+a;
const pick=a=>a[Math.floor(Math.random()*a.length)];
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const fmt=n=>Number(n).toLocaleString('en-US',{maximumFractionDigits:2});
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function mc(correct,cands,f=fmt){
  const c0=f(correct),seen=new Set([c0]),opts=[c0];
  for(const c of shuffle(cands)){const s=f(c);if(!seen.has(s)&&opts.length<4){seen.add(s);opts.push(s)}}
  const step=Math.max(1,Math.round(Math.abs(correct)*0.1));let k=1;
  while(opts.length<4&&k<40){const s=f(correct+step*Math.ceil(k/2)*(k%2?1:-1));k++;if(!seen.has(s)){seen.add(s);opts.push(s)}}
  const sh=shuffle(opts);return{opts:sh,ans:sh.indexOf(c0)};
}
const signed=(v,unit='')=>(v>0?'+':v<0?'−':'')+fmt(Math.abs(v))+unit;

const SECTIONS=[
  {key:'num',name:'Numerical Reasoning',vi:'Suy luận số học',count:12,minutes:10,tip:'Được dùng giấy, bút và máy tính. Đọc kỹ đơn vị và đề hỏi giá trị nào.'},
  {key:'verb',name:'Verbal Reasoning',vi:'Suy luận ngôn ngữ',count:15,minutes:10,tip:'Chỉ dựa vào thông tin trong đoạn văn. Chọn Cannot say khi đoạn văn không đủ để kết luận đúng hay sai.'},
  {key:'abs',name:'Abstract Reasoning',vi:'Suy luận trừu tượng',count:50,minutes:10,tip:'Khoảng 12 giây mỗi câu. Tìm quy luật thay đổi của từng yếu tố: xoay, số cạnh, tô màu, số chấm, vị trí ô vuông.'},
  {key:'crit',name:'Critical Thinking',vi:'Tư duy phản biện',count:16,minutes:12,tip:'Gồm suy diễn, giả định ngầm, đánh giá lập luận. Kết luận phải chắc chắn đúng, không phải chỉ có vẻ hợp lý.'},
];
const LEVELS={easy:'Dễ',medium:'Trung bình',hard:'Khó',mixed:'Tăng dần'};

/* ---------- numerical ---------- */
const NUM={
easy:[
 ()=>{const p=pick([10,15,20,25,30,40,60]),y=R(2,30)*20,a=p*y/100;
  return{q:`What is ${p}% of ${fmt(y)}?`,...mc(a,[a*2,a/2,y-a,a+10]),exp:`${p}% × ${fmt(y)} = ${fmt(y)} × ${p/100} = ${fmt(a)}.`}},
 ()=>{const a=R(2,20),d=R(3,9),t=[0,1,2,3,4].map(i=>a+i*d),n=a+5*d;
  return{q:`What number comes next? ${t.join(', ')}, ?`,...mc(n,[n+d,n-1,n+1,n-d+1]),exp:`Mỗi số tăng thêm ${d}: ${t[4]} + ${d} = ${n}.`}},
 ()=>{const n=R(3,6),u=R(3,12)+pick([0,0.5]);let m=pick([7,8,9,10,12,15]);const p=n*u,a=m*u;
  return{q:`A pack of ${n} notebooks costs $${fmt(p)}. At the same price per notebook, how much do ${m} notebooks cost?`,...mc(a,[a+u,a-u,p+m,m*(u+1)],v=>'$'+fmt(v)),exp:`Giá mỗi cuốn: $${fmt(p)} ÷ ${n} = $${fmt(u)}. ${m} cuốn: ${m} × $${fmt(u)} = $${fmt(a)}.`}},

function genSeries(level,force){
  const nr={easy:1,medium:2,hard:3}[level];let rules;
  do{rules=force||shuffle(['rot','sides','fill','dots','corner','size','dash']).slice(0,nr)}while(rules.includes('rot')&&rules.includes('sides')||rules.includes('dash')&&rules.includes('fill'));
  const P={};
  if(rules.includes('rot'))P.rot={start:pick([0,45,90,135,180,225,270,315]),step:pick(level==='easy'?[90]:level==='medium'?[45,90]:[45,135])*pick([1,-1])};
  if(rules.includes('sides'))P.sides=level==='hard'&&Math.random()<.5?{start:7,step:-1}:{start:3,step:1};
  if(rules.includes('fill'))P.fill={period:level==='hard'?pick([2,3]):2,phase:R(0,1)};
  if(rules.includes('dots'))P.dots=level==='hard'&&Math.random()<.5?{start:5,step:-1}:{start:1,step:1};
  if(rules.includes('size'))P.size=level==='easy'||Math.random()<.5?{vals:[1,.65],start:R(0,1)}:{vals:[.6,.8,1],start:0};
  if(rules.includes('dash'))P.dash={phase:R(0,1)};
  if(rules.includes('corner'))P.corner={start:R(0,3),step:pick(level==='easy'?[1]:level==='medium'?[1,3]:[1,2,3])};
  const shape=P.sides?'poly':P.rot?'arrow':pick(['arrow','poly']);
  const base={sides:R(3,6),rot:shape==='arrow'?pick([0,90,180,270]):0,fill:!P.dash&&Math.random()<.5,dots:level==='easy'?0:R(0,3),corner:level==='hard'?R(0,3):-1,scale:1,dash:false};
  const st=i=>({shape,
    sides:P.sides?P.sides.start+i*P.sides.step:base.sides,
    rot:P.rot?(((P.rot.start+i*P.rot.step)%360)+360)%360:base.rot,
    fill:P.fill?((i+P.fill.phase)%P.fill.period===0):base.fill,
    dots:P.dots?P.dots.start+i*P.dots.step:base.dots,
    corner:P.corner?(P.corner.start+i*P.corner.step)%4:base.corner,
    scale:P.size?P.size.vals[(P.size.start+i)%P.size.vals.length]:base.scale,
    dash:P.dash?(i+P.dash.phase)%2===0:base.dash});
  const seq=[0,1,2,3].map(st),A=st(4),m=o=>({...A,...o});
  const groups=[];
  if(P.rot)groups.push(shuffle([m({rot:(A.rot+P.rot.step+360)%360}),m({rot:(A.rot+180)%360}),m({rot:seq[3].rot})]));
  if(P.sides)groups.push(shuffle([m({sides:A.sides+1}),m({sides:Math.max(3,A.sides-1)})]));
  if(P.fill)groups.push([m({fill:!A.fill})]);
  if(P.dots)groups.push(shuffle([m({dots:A.dots+1}),m({dots:Math.max(0,A.dots-1)})]));
  if(P.size)groups.push(shuffle([.6,.8,1,.65].filter(x=>x!==A.scale)).slice(0,2).map(x=>m({scale:x})));
  if(P.dash)groups.push([m({dash:!A.dash})]);
  if(P.corner)groups.push(shuffle([m({corner:(A.corner+1)%4}),m({corner:(A.corner+2)%4})]));
  const extra=shuffle([P.dash?m({scale:A.scale===1?.75:1}):m({fill:!A.fill}),m({dots:A.dots+1}),shape==='arrow'?m({rot:(A.rot+90)%360}):m({sides:A.sides+1}),m({dots:Math.max(0,A.dots-1)})]);
  const key=s=>JSON.stringify(s),seen=new Set([key(A)]),ds=[];
  const add=s=>{if(ds.length<3&&!seen.has(key(s))){seen.add(key(s));ds.push(s)}};
  for(let r=0;r<3;r++)for(const g of groups)if(g[r])add(g[r]);
  extra.forEach(add);
  const opts=shuffle([A,...ds]);
  const dir=s=>s>0?'theo chiều kim đồng hồ':'ngược chiều kim đồng hồ';
  const ex=[];
  if(P.rot)ex.push(`mũi tên xoay ${dir(P.rot.step)} ${Math.abs(P.rot.step)}° mỗi bước`);
  if(P.sides)ex.push(`số cạnh của hình ${P.sides.step>0?'tăng':'giảm'} 1 mỗi bước`);
  if(P.fill)ex.push(P.fill.period===2?'hình xen kẽ tô đặc và để rỗng':'cứ 3 hình thì có 1 hình tô đặc');
  if(P.dots)ex.push(`số chấm ${P.dots.step>0?'tăng':'giảm'} 1 mỗi bước`);
  if(P.size)ex.push(P.size.vals.length===2?'hình xen kẽ to và nhỏ':'hình to dần qua 3 cỡ rồi quay lại cỡ nhỏ nhất');
  if(P.dash)ex.push('viền hình xen kẽ nét liền và nét đứt');
  if(P.corner)ex.push(`ô vuông nhỏ ${P.corner.step===1?'đi 1 góc theo chiều kim đồng hồ':P.corner.step===3?'đi 1 góc ngược chiều kim đồng hồ':'nhảy sang góc đối diện'}`);
  const e=ex.join('; ');
  return{seq,opts,ans:opts.indexOf(A),exp:`Quy luật: ${e.charAt(0).toUpperCase()+e.slice(1)}.${ex.length>1?' Đáp án đúng phải thỏa mãn tất cả quy luật cùng lúc; mỗi phương án sai thường chỉ sai một yếu tố.':''}`};
}
/* ---------- abstract: các dạng ngoài dãy hình ----------
   form: undefined = dãy hình (kể cả hai chuỗi xen kẽ), 'matrix' = lưới 3×3, 'odd' = tìm hình khác loại. */
const ABS0={shape:'poly',sides:4,rot:0,fill:false,dots:0,corner:-1,scale:1,dash:false};
const absKey=s=>JSON.stringify(s);
const mod360=x=>((x%360)+360)%360;
// Chọn tối đa n phương án nhiễu khác nhau và khác đáp án, theo thứ tự ưu tiên.
function absOpts(A,cands,exp,extra={}){
  const seen=new Set([absKey(A)]),ds=[];
  for(const c of cands)if(ds.length<3&&!seen.has(absKey(c))){seen.add(absKey(c));ds.push(c)}
  const opts=shuffle([A,...ds]);
  return{...extra,opts,ans:opts.indexOf(A),exp};
}
const ABS_TEXT={matrix:'Which figure completes the grid?',odd:'Which figure is the odd one out?'};
function absStem(q){
  const p=s=>`<div class="panel">${panelSVG(s)}</div>`;
  if(q.form==='matrix')return`<div class="mgrid">${q.grid.map(p).join('')}<div class="panel q">?</div></div>`;
  if(q.form==='odd')return'';
  return`<div class="seq">${q.seq.map(p).join('')}<div class="panel q">?</div></div>`;
}

function genOdd(level,force){
  const v=force||(level==='easy'?'sides':level==='medium'?pick(['sides','dotsides']):pick(['dotsides','point']));
  const fills=shuffle([true,true,false,false]);
  let figs,exp;
  if(v==='sides'){
    // 4 tổ hợp màu/chấm/cỡ khác nhau, mỗi yếu tố chia đều hai–hai, nên chỉ số cạnh là khác biệt duy nhất
    const n=R(3,6),m=n===3?4:n+pick([1,-1]),d=shuffle([R(0,1),R(2,3)]),combo=shuffle([[true,d[0],1],[true,d[1],.8],[false,d[0],.8],[false,d[1],1]]);
    figs=combo.map(([f,dt,sz],i)=>({...ABS0,sides:i===0?m:n,fill:f,dots:dt,scale:sz}));
    exp=`Ba hình có ${n} cạnh, chỉ một hình có ${m} cạnh. Màu, số chấm và kích thước được chia đều hai–hai nên không phải yếu tố khác biệt.`;
  }else if(v==='dotsides'){
    const sides=shuffle([3,4,5,6,7]).slice(0,4),off=pick([1,-1]);
    figs=sides.map((n,i)=>({...ABS0,sides:n,dots:i===0?n-2+off:n-2,fill:fills[i]}));
    exp=`Ở ba hình, số chấm luôn ít hơn số cạnh đúng 2. Hình khác loại có ${figs[0].sides} cạnh nhưng ${figs[0].dots} chấm. Số cạnh khác nhau ở cả bốn hình nên không tự nó là quy luật.`;
  }else{
    const corners=shuffle([0,1,2,3]),toward=[315,45,135,225];
    figs=corners.map((c,i)=>({...ABS0,shape:'arrow',corner:c,fill:fills[i],rot:i===0?mod360(toward[c]+pick([90,180,270])):toward[c]}));
    exp='Ở ba hình, mũi tên chỉ thẳng vào ô vuông nhỏ ở góc. Hình khác loại có mũi tên chỉ hướng khác.';
  }
  const odd=figs[0],opts=shuffle(figs);

function genMatrix(level){
  const V={sides:shuffle([3,4,5]),dots:shuffle([0,1,2]),scale:shuffle([.6,.8,1]),corner:shuffle([0,1,2,3]).slice(0,3)};
  const name={sides:'số cạnh',dots:'số chấm',scale:'kích thước',corner:'vị trí ô vuông nhỏ'};
  const fill=Math.random()<.5;
  let cell,attrs,rule;
  if(level==='hard'){
    // kiểu Raven: mỗi giá trị xuất hiện đúng một lần trên mỗi hàng và mỗi cột
    const la=pick(['sides','dots']),rb=pick(['scale','corner']);
    cell=(r,c)=>({...ABS0,fill,[la]:V[la][(r+c)%3],[rb]:V[rb][r]});attrs=[la,rb];
    rule=`${cap(name[la])}: mỗi hàng và mỗi cột có đủ 3 giá trị (${V[la].join(', ')}), không lặp lại. ${cap(name[rb])} giống nhau trong cùng một hàng.`;
  }else{
    const ra=pick(['sides','scale']),ca=pick(['dots','corner']);
    cell=(r,c)=>({...ABS0,fill,[ra]:V[ra][r],[ca]:V[ca][c]});attrs=[ra,ca];
    rule=`${cap(name[ra])} giống nhau trong cùng một hàng; ${name[ca]} giống nhau trong cùng một cột.`;
  }
  const grid=[];for(let r=0;r<3;r++)for(let c=0;c<3;c++)if(r<2||c<2)grid.push(cell(r,c));
  const A=cell(2,2),m=o=>({...A,...o}),cands=[];
  for(const k of attrs)V[k].filter(x=>x!==A[k]).forEach(x=>cands.push(m({[k]:x})));
  return absOpts(A,[...shuffle(cands),m({fill:!fill})],`Quy luật: ${rule} Ô còn thiếu phải thỏa mãn cả hai điều kiện.`,{form:'matrix',grid,seq:[]});
}

function genOverlay(level){
  const op=level==='hard'?'xor':'or',bits=x=>x.toString(2).replace(/0/g,'').length;
  const f=(a,b)=>op==='xor'?a^b:a|b;
  const rnd=()=>{let m;do{m=R(1,255)}while(bits(m)<2||bits(m)>4);return m};
  const row=()=>{let a,b,c;do{a=rnd();b=rnd();c=f(a,b)}while(a===b||!c||c===a||c===b);return[a,b,c]};
  const rows=[row(),row(),row()],L=x=>({...ABS0,shape:'lines',mask:x});
  const [a,b,c]=rows[2];
  const cands=[...(op==='xor'?[a|b,a&b]:[a^b,a,b]),...shuffle([0,1,2,3,4,5,6,7]).map(i=>c^(1<<i))].filter(x=>x>0);
  return absOpts(L(c),cands.map(L),op==='xor'
    ?'Quy luật: Ở mỗi hàng, hình thứ ba là hai hình đầu chồng lên nhau, nhưng nét nào có ở cả hai hình thì bị xóa. Cách làm: so từng nét một, nét xuất hiện đúng một lần thì giữ.'
    :'Quy luật: Ở mỗi hàng, hình thứ ba gộp tất cả các nét của hai hình đầu. Kiểm tra từng nét: có ở hình 1 hoặc hình 2 thì phải có ở hình 3.',
    {form:'matrix',grid:rows.flat().slice(0,8).map(L),seq:[]});
}

function genAlt(){
  const stepA=pick([90,-90,45,-45]),r0=pick([0,90,180,270]),fillA=Math.random()<.5,s0=R(3,4),dotsB=R(0,2);

function genAbs(level){
  const W={easy:[['series',.75],['odd',.25]],
    medium:[['series',.45],['matrix',.25],['odd',.15],['overlay',.15]],
    hard:[['series',.35],['alt',.2],['matrix',.2],['overlay',.15],['odd',.1]]}[level];
  let r=Math.random(),form='series';
  for(const [f,w] of W){if(r<w){form=f;break}r-=w}
  return{series:genSeries,odd:genOdd,matrix:genMatrix,overlay:genOverlay,alt:genAlt}[form](level);
}

function panelSVG(s){
  let g='';const fill=s.fill?'currentColor':'none',dash=s.dash?' stroke-dasharray="7 5"':'';
  if(s.shape==='lines'){
    // 8 nét quanh một ô vuông: 4 cạnh, 2 đường chéo, 2 đường giữa
    const L=[[22,22,78,22],[78,22,78,78],[22,78,78,78],[22,22,22,78],[22,22,78,78],[78,22,22,78],[50,22,50,78],[22,50,78,50]];
    g+=[[22,22],[78,22],[78,78],[22,78]].map(([x,y])=>`<circle cx="${x}" cy="${y}" r="2" fill="currentColor" opacity=".3"/>`).join('');
    L.forEach((l,i)=>{if(s.mask>>i&1)g+=`<line x1="${l[0]}" y1="${l[1]}" x2="${l[2]}" y2="${l[3]}" stroke="currentColor" stroke-width="4" stroke-linecap="round"/>`});
    return`<svg viewBox="0 0 100 100" aria-hidden="true">${g}</svg>`;
  }
  const k=s.scale??1,sc=k===1?'':` transform="translate(50 47) scale(${k}) translate(-50 -47)"`;
  g+=`<g${sc}>`;
  if(s.shape==='arrow'){
    g+=`<g transform="rotate(${s.rot} 50 46)"><path d="M50 22 L67 42 L56 42 L56 70 L44 70 L44 42 L33 42 Z" fill="${fill}" stroke="currentColor" stroke-width="3" stroke-linejoin="round"${dash}/></g>`;
  }else{
    const n=s.sides,pts=[];for(let i=0;i<n;i++){const a=(-90+i*360/n)*Math.PI/180;pts.push((50+23*Math.cos(a)).toFixed(1)+','+(48+23*Math.sin(a)).toFixed(1))}
    g+=`<polygon points="${pts.join(' ')}" fill="${fill}" stroke="currentColor" stroke-width="3" stroke-linejoin="round"${dash}/>`;
  }
  g+='</g>';
  for(let i=0;i<s.dots;i++)g+=`<circle cx="${50-(s.dots-1)*4.5+i*9}" cy="88" r="2.8" fill="currentColor"/>`;
  if(s.corner>=0){const c=[[6,6],[86,6],[86,86],[6,86]][s.corner];g+=`<rect x="${c[0]}" y="${c[1]}" width="8" height="8" fill="currentColor"/>`}
  return`<svg viewBox="0 0 100 100" aria-hidden="true">${g}</svg>`;
}

    const n={easy:3,medium:4,hard:5}[lv],pp=shuffle(NAMES).slice(0,n);
    const rel=pick([['is taller than','is shorter than','tallest','shortest','Từ cao đến thấp'],['is older than','is younger than','oldest','youngest','Từ lớn đến nhỏ tuổi'],['finished the race before','finished the race after','first','last','Thứ tự về đích']]);
    const race=rel[2]==='first';
    let clues=[];for(let i=0;i<n-1;i++)clues.push(Math.random()<.5?`${pp[i]} ${rel[0]} ${pp[i+1]}.`:`${pp[i+1]} ${rel[1]} ${pp[i]}.`);
    if(lv!=='easy')clues=shuffle(clues);
    const idx=lv==='easy'?pick([0,n-1]):lv==='medium'?pick([1,2]):pick([1,2,3]),ord=['','second','third','fourth'];
    const ask=race?`Who finished ${idx===0?'first':idx===n-1?'last':ord[idx]}?`:idx===0?`Who is the ${rel[2]}?`:idx===n-1?`Who is the ${rel[3]}?`:`Who is the ${ord[idx]} ${rel[2]}?`;
    q=clues.join(' ')+' '+ask;
    o=[pp[idx],...shuffle(pp.filter((_,i)=>i!==idx)).slice(0,3)];if(o.length<4)o.push('It cannot be determined.');
    e=`${rel[4]}: ${pp.join(', ')}.`;
  }else if(['allA','someAll','noSome'].includes(k)){
    const[A,B,Cc]=pick(CATS),nm=pick(NAMES);
    if(k==='allA'){q=`All ${A} are ${B}. ${nm} is one of the ${A}. Which conclusion follows?`;o=[`${nm} is one of the ${B}.`,`All ${B} are ${A}.`,`${nm} is not one of the ${B}.`,`It cannot be determined whether ${nm} is one of the ${B}.`];e=`Mọi người trong nhóm "${A}" đều thuộc "${B}", và ${nm} thuộc "${A}", nên ${nm} thuộc "${B}". Không suy ra được chiều ngược lại.`}
    if(k==='someAll'){q=`Some ${A} are ${B}. All ${B} are ${Cc}. Which conclusion must be true?`;o=[`Some ${A} are ${Cc}.`,`All ${A} are ${Cc}.`,`All ${Cc} are ${B}.`,`Some ${B} are not ${A}.`];e=`Những "${A}" thuộc "${B}" thì chắc chắn thuộc "${Cc}", nên ít nhất một số "${A}" thuộc "${Cc}". Các phương án khác không được đảm bảo.`}
    if(k==='noSome'){q=`No ${A} are ${B}. Some ${Cc} are ${A}. Which conclusion must be true?`;o=[`Some ${Cc} are not ${B}.`,`No ${Cc} are ${B}.`,`Some ${B} are ${Cc}.`,`All ${A} are ${Cc}.`];e=`Những "${Cc}" thuộc "${A}" thì chắc chắn không thuộc "${B}". Không biết gì về những "${Cc}" còn lại.`}
  }else{
    const[P,Q,nP,nQ]=pick(CONDS),rule=`If ${P}, ${Q}.`;
    if(k==='mp'){q=`${cap(rule)} Today, ${P}. Which conclusion follows?`;o=[cap(Q)+'.',cap(nQ)+'.','It cannot be determined.',cap(nP)+'.'];e=`Điều kiện đã xảy ra, nên kết quả chắc chắn xảy ra.`}
    if(k==='mt'){q=`${cap(rule)} Today, ${nQ}. Which conclusion follows?`;o=[cap(nP)+'.',cap(P)+'.','It cannot be determined.',cap(Q)+'.'];e=`Phủ định hệ quả: nếu điều kiện xảy ra thì kết quả phải xảy ra; kết quả không xảy ra nên điều kiện cũng không xảy ra.`}
    if(k==='ac'){q=`${cap(rule)} Today, ${Q}. Which conclusion follows?`;o=[`It cannot be determined whether ${P}.`,cap(P)+'.',cap(nP)+'.',cap(nQ)+'.'];e=`Lỗi khẳng định hệ quả: kết quả xảy ra có thể do nguyên nhân khác, nên không kết luận được về điều kiện.`}
    if(k==='da'){q=`${cap(rule)} Today, ${nP}. Which conclusion follows?`;o=[`It cannot be determined whether ${Q}.`,cap(nQ)+'.',cap(Q)+'.',cap(P)+'.'];e=`Lỗi phủ định tiền đề: điều kiện không xảy ra không có nghĩa là kết quả cũng không xảy ra.`}
  }
  const sh=shuffle(o.map((t,i)=>({t,i})));
  return{type:'crit',q,opts:sh.map(x=>x.t),ans:sh.findIndex(x=>x.i===0),exp:e,level:lv};
}
function critPool(lv,n){
  const out=critItems(lv).slice(0,n),seen=new Set(out.map(x=>x.q));let t=0;
  while(out.length<n&&t<200){const g=genCrit(lv);t++;if(!seen.has(g.q)){seen.add(g.q);out.push(g)}}
  return shuffle(out);
}

/* ---------- build question sets ---------- */
const lvAt=(i,n,level)=>level!=='mixed'?level:(i<Math.round(n/3)?'easy':i<Math.round(2*n/3)?'medium':'hard');
const FALLBACK={easy:['easy','medium','hard'],medium:['medium','easy','hard'],hard:['hard','medium','easy']};
const split=n=>{const e=Math.round(n/3),m=Math.round(n/3);return{easy:e,medium:m,hard:n-e-m}};
function verbItems(lv){return shuffle(VERB[lv]).flatMap(p=>p.s.map(s=>({type:'verb',passage:p.p,statement:s[0],opts:[T,F,C],ans:[T,F,C].indexOf(s[1]),exp:s[2],level:lv})))}
function critItems(lv){return shuffle(CRIT[lv]).map(c=>{const o=shuffle(c.o.map((t,i)=>({t,i})));return{type:'crit',q:c.q,opts:o.map(x=>x.t),ans:o.findIndex(x=>x.i===c.a),exp:c.e,level:lv}})}
function bankCount(key,lv){return key==='verb'?VERB[lv].reduce((s,p)=>s+p.s.length,0):CRIT[lv].length}
function build(def,level){
  const n=def.count;
  if(def.key==='num'||def.key==='abs'){
    const out=[],seen=new Set();
    for(let i=0;i<n;i++){const lv=lvAt(i,n,level);let q,t=0;
      do{q=def.key==='num'?pick(NUM[lv])():genAbs(lv);t++}while(def.key==='num'&&seen.has(q.q)&&t<8);
      if(q.q)seen.add(q.q);out.push({...q,type:def.key,level:lv})}
    return out;
  }
  const part=(lv,k)=>def.key==='verb'?verbItems(lv).slice(0,k):critPool(lv,k);
  if(level==='mixed'){const s=split(n);return['easy','medium','hard'].flatMap(lv=>part(lv,s[lv]))}
  return part(level,n);
}

 {p:`A logistics firm tested route-planning software in two of its six depots for three months. In those depots, fuel costs fell by 9% and late deliveries fell by a third. The other four depots, which did not use the software, saw fuel costs rise by 2% over the same period, mainly because fuel prices increased. The firm will decide whether to roll out the software after a review in January.`,
  s:[[`The software was tested in a minority of the firm's depots.`,T,`Thử nghiệm ở 2 trên 6 kho, tức chưa đến một nửa.`],
     [`Fuel costs fell in every one of the firm's depots during the trial.`,F,`Bốn kho không dùng phần mềm có chi phí nhiên liệu tăng 2%.`],
     [`The firm has already decided to use the software in all depots.`,F,`Công ty mới chỉ sẽ quyết định sau đợt đánh giá vào tháng 1.`],
     [`The trial depots made fewer total deliveries than the other depots.`,C,`Đoạn văn chỉ nói giao trễ giảm một phần ba, không cho biết tổng số chuyến giao của từng nhóm kho.`]]},
 {p:`Microplastics are plastic particles smaller than five millimetres. Some are manufactured at that size, for example for use in cosmetics, while others form when larger plastic items break down. Researchers have found microplastics in seawater, soil and drinking water. Their long-term effects on human health are still being studied, and scientists say current evidence is not sufficient to draw firm conclusions.`,
  s:[[`All microplastics come from larger plastic items breaking down.`,F,`Một số hạt được sản xuất sẵn ở kích thước nhỏ, ví dụ dùng trong mỹ phẩm.`],
     [`Microplastics have been found in drinking water.`,T,`Đoạn văn liệt kê nước uống trong các nơi đã phát hiện vi nhựa.`],
     [`Microplastics are harmful to human health.`,C,`Các nhà khoa học nói bằng chứng hiện tại chưa đủ để kết luận chắc chắn, nên không thể nói đúng hay sai.`],
     [`A plastic particle measuring three millimetres counts as a microplastic.`,T,`Vi nhựa được định nghĩa là hạt nhỏ hơn năm milimét; ba milimét thỏa điều kiện.`]]},
 {p:`To qualify for the company's annual innovation award, a project must have been completed within the last twelve months and must have produced measurable savings or revenue. Projects led by members of the award committee are not eligible. This year, the committee received 38 nominations and shortlisted eight of them.`,
  s:[[`A project completed two years ago can qualify for this year's award.`,F,`Dự án phải hoàn thành trong vòng mười hai tháng gần nhất.`],
     [`Fewer than a quarter of this year's nominations were shortlisted.`,T,`8 trên 38 là khoảng 21%, nhỏ hơn 25%.`],
     [`A project led by a member of the award committee could win this year's award.`,F,`Đoạn văn nói dự án do thành viên hội đồng giải thưởng dẫn dắt không đủ điều kiện ("are not eligible").`],
     [`All eight shortlisted projects produced revenue.`,C,`Điều kiện là tạo ra tiết kiệm HOẶC doanh thu; có thể một số dự án chỉ tạo ra tiết kiệm.`]]},
 {p:`Cloud gaming services stream games from remote servers, so players do not need expensive hardware. However, they require a stable internet connection, and most providers recommend a speed of at least 15 Mbps. In a recent industry survey, 41% of gamers said they had tried cloud gaming, but only 12% said they used it regularly. The most common reason given for not using it more was input delay.`,
  s:[[`Cloud gaming allows people to play without owning expensive hardware.`,T,`Câu đầu đoạn văn nói người chơi không cần phần cứng đắt tiền.`],
     [`Most of the gamers surveyed used cloud gaming regularly.`,F,`Chỉ 12% dùng thường xuyên.`],
     [`Input delay was the most frequently mentioned reason for not using cloud gaming more.`,T,`Đoạn văn nói đây là lý do phổ biến nhất.`],
     [`Cloud gaming will become more popular than console gaming within five years.`,C,`Đoạn văn không đưa ra dự báo nào về tương lai.`]]},
],
hard:[
 {p:`Some economists argue that a four-day working week raises productivity because rested employees work more efficiently. Critics respond that the trials most often cited involved office-based firms that volunteered to take part, which may already have been well suited to the change. A national trial now under way includes manufacturing and healthcare employers, sectors where output depends more directly on hours worked. Its results are expected next year.`,
  s:[[`The trials most often cited involved firms that chose to participate.`,T,`Phía phản biện nói các thử nghiệm hay được trích dẫn gồm các công ty tình nguyện tham gia.`],
     [`The national trial includes only office-based firms.`,F,`Thử nghiệm quốc gia có cả doanh nghiệp sản xuất và y tế.`],
     [`The national trial will show that a four-day week reduces output in healthcare.`,C,`Kết quả chưa có (dự kiến năm sau), nên không thể biết.`],
     [`Critics claim that a four-day week always lowers productivity.`,F,`Phía phản biện chỉ nghi ngờ tính đại diện của mẫu thử, không khẳng định năng suất luôn giảm.`]]},
 {p:`Under the supplier policy, any contract worth more than 500 million VND requires three competing quotes, unless the supplier is the only one able to provide the service. Contracts renewed with an existing supplier on unchanged terms are exempt from this requirement. In March, the procurement team renewed a 700-million-VND cleaning contract with its current supplier but increased the scope to cover a new building.`,
  s:[[`A 600-million-VND contract with a new supplier needs three competing quotes, unless that supplier is the only one able to provide the service.`,T,`Hợp đồng trên 500 triệu VND phải có ba báo giá, ngoại lệ duy nhất cho hợp đồng mới là nhà cung cấp độc quyền; miễn trừ gia hạn không áp dụng cho nhà cung cấp mới.`],
     [`The March cleaning contract was exempt from the three-quote requirement because it was a renewal.`,F,`Miễn trừ chỉ áp dụng khi gia hạn với điều khoản không đổi; hợp đồng này đã mở rộng phạm vi nên không được miễn vì lý do gia hạn.`],
     [`The procurement team obtained three quotes for the March cleaning contract.`,C,`Đoạn văn không nói nhóm mua hàng có lấy ba báo giá hay không.`],
     [`The current cleaning supplier is the only company able to clean the new building.`,C,`Không có thông tin cho biết nhà cung cấp này có phải đơn vị duy nhất hay không.`]]},
 {p:`In 2015, a coastal city built a sea wall to protect its harbour district from storm surges. Since then, the district has not flooded, although two major storms have hit the coast. Property values in the district have risen by 60%, compared with 35% across the city as a whole. A council report credits the wall for the difference, but the same period also saw a new metro line open in the district.`,
  s:[[`The harbour district has flooded since the sea wall was built.`,F,`Đoạn văn nói từ khi xây tường chắn, khu này chưa bị ngập.`],
     [`Property values rose faster in the harbour district than in the city overall.`,T,`60% so với 35% của toàn thành phố.`],
     [`The sea wall was the main cause of the rise in property values.`,C,`Báo cáo hội đồng cho là do tường chắn, nhưng tuyến metro mới cũng mở cùng thời gian; đoạn văn không đủ để xác định nguyên nhân chính.`],
     [`At least two major storms have hit the coast since the sea wall was built.`,T,`Đoạn văn nói "although two major storms have hit the coast" trong giai đoạn kể từ khi xây tường chắn.`]]},
 {p:`A retailer's loyalty programme gives members one point for every 10,000 VND spent. Points expire 18 months after they are earned. Members who earn more than 2,000 points in a calendar year are upgraded to Gold status for the following year, which doubles the rate at which they earn points. Points cannot be transferred between members.`,
  s:[[`A Gold member earns two points for every 10,000 VND spent.`,T,`Hạng Gold nhân đôi tốc độ tích điểm, từ một lên hai điểm cho mỗi 10.000 VND.`],
     [`A member can give unused points to a family member.`,F,`Điểm không được chuyển giữa các thành viên.`],
     [`A member who spent 25 million VND during 2025 at the standard rate is upgraded to Gold status for 2026.`,T,`25.000.000 ÷ 10.000 = 2.500 điểm trong một năm dương lịch, vượt ngưỡng 2.000 điểm nên được lên hạng Gold cho năm sau.`],
     [`Most members reach Gold status.`,C,`Đoạn văn không cho biết tỷ lệ thành viên đạt hạng Gold.`]]},
]};
/* ---------- critical thinking: câu mới ----------
   Cùng định dạng CRIT trong index.html: {q, o: 4 phương án, a: index đáp án, e: giải thích}.
   Giao diện chỉ hiển thị tối đa 4 phương án (nhãn 'ABCD') và critItems() sẽ trộn thứ tự,
   nên không dùng phương án kiểu "All of the above" hay thang 5 mức.
   Dạng Watson-Glaser ghi ở đầu q: [Inference], [Recognition of assumptions], [Deduction], [Interpretation], [Evaluation of arguments].
   Cách ghép: CRIT.easy.push(...CRIT_NEW.easy); CRIT.medium.push(...CRIT_NEW.medium); CRIT.hard.push(...CRIT_NEW.hard); */
const CRIT_NEW={
easy:[
 {q:`[Deduction] All laptops issued by the IT department are encrypted. Some devices in the meeting room are laptops issued by the IT department. Which conclusion follows?`,o:[`Some devices in the meeting room are encrypted.`,`All devices in the meeting room are encrypted.`,`All encrypted devices were issued by the IT department.`,`There are no unencrypted devices in the meeting room.`],a:0,e:`Những thiết bị trong phòng họp là laptop của IT thì chắc chắn được mã hóa, nên ít nhất một số thiết bị trong phòng được mã hóa. Không biết gì về các thiết bị còn lại, và không suy ngược được "mọi thiết bị mã hóa đều của IT".`},
 {q:`[Recognition of assumptions] "We should move the team training online so that more staff in our regional offices can attend." Which assumption does this statement make?`,o:[`Staff in the regional offices are able to access online training.`,`Online training is cheaper than classroom training.`,`Classroom training is ineffective.`,`Staff at head office dislike training.`],a:0,e:`Đề xuất chỉ đạt mục tiêu "nhiều nhân viên vùng tham dự hơn" nếu họ thực sự truy cập được khóa học trực tuyến. Chi phí hay hiệu quả của lớp trực tiếp không được lập luận nhắc tới và không cần thiết cho nó.`},
 {q:`[Inference] A café near a university makes the same number of sandwiches every day. During exam week, the sandwiches sold out by 11 a.m. every weekday; in normal weeks they usually last until early afternoon. Which inference is most strongly supported?`,o:[`Demand for the café's sandwiches was higher during exam week than in a normal week.`,`Students eat more when they are stressed.`,`The café made fewer sandwiches during exam week.`,`The café will make more sandwiches next exam week.`],a:0,e:`Số bánh làm ra mỗi ngày không đổi mà bán hết sớm hơn, nên nhu cầu tuần thi cao hơn. Phương án 3 mâu thuẫn với dữ kiện; lý do tâm lý và kế hoạch tương lai thì đoạn văn không đủ thông tin.`},
 {q:`[Interpretation] In a staff survey, 80 of the 100 respondents rated the new office layout as "good" or "excellent". Which conclusion follows beyond reasonable doubt?`,o:[`Most of the survey respondents rated the new layout positively.`,`80% of all staff like the new layout.`,`The old layout received lower ratings.`,`20 respondents rated the new layout as "poor".`],a:0,e:`80/100 người trả lời chọn "good" hoặc "excellent", tức đa số đánh giá tích cực. Không biết toàn bộ nhân viên có tham gia khảo sát không, không có số liệu về bố cục cũ, và 20 người còn lại có thể chọn "fair" chứ chưa chắc là "poor".`},
 {q:`[Evaluation of arguments] Should the company provide free parking for employees? Which argument is the strongest?`,o:[`Yes; many employees arrive late because they spend about 20 minutes looking for paid parking.`,`Yes; parking is free at some shopping malls.`,`No; some employees cycle to work.`,`No; employees' cars come in many different colours.`],a:0,e:`Lập luận mạnh phải vừa quan trọng vừa liên quan trực tiếp. Việc nhân viên đi muộn vì tìm chỗ đỗ là tác động thực tế tới công việc. Trung tâm thương mại và màu xe không liên quan; việc một số người đi xe đạp có liên quan nhưng không đủ quan trọng để bác bỏ đề xuất.`},
 {q:`[Deduction] Any invoice above $5,000 must be signed by the finance director. Invoice #218 is for $7,200. Which conclusion follows?`,o:[`Invoice #218 must be signed by the finance director.`,`Invoice #218 has already been signed.`,`Invoices below $5,000 do not need any signature.`,`The finance director will reject invoice #218.`],a:0,e:`Hóa đơn 7.200 USD vượt ngưỡng 5.000 USD nên bắt buộc phải có chữ ký giám đốc tài chính. Quy định không cho biết hóa đơn đã được ký chưa, và không nói gì về hóa đơn dưới 5.000 USD (suy ra như vậy là lỗi phủ định tiền đề).`},
 {q:`[Recognition of assumptions] "Let's send the contract by courier instead of by post, so that it arrives before Friday's deadline." Which assumption does this statement make?`,o:[`The courier can deliver the contract before Friday.`,`The contract is confidential.`,`Post is cheaper than a courier.`,`The deadline cannot be extended.`],a:0,e:`Lựa chọn courier chỉ hợp lý nếu courier giao kịp trước thứ Sáu. Tính bảo mật, giá cước hay khả năng gia hạn không phải điều kiện để lập luận đứng vững.`},
 {q:`[Evaluation of arguments] Should the city plant more trees along its main roads? Which argument is the strongest?`,o:[`Yes; measurements in the city show that tree-lined streets are about 2°C cooler in summer, which reduces heat-related illness.`,`Yes; trees look nice in photographs.`,`No; leaves fall from trees in autumn.`,`No; some other cities have not planted trees along their roads.`],a:0,e:`Phương án đầu dựa trên số liệu đo tại chính thành phố và nêu lợi ích quan trọng về sức khỏe. Các phương án còn lại hoặc chỉ là cảm tính, hoặc là chi tiết nhỏ, hoặc dựa vào việc nơi khác làm gì.`},
],
medium:[
 {q:`[Inference] Over five years, Company Z's annual staff turnover fell from 25% to 12%. During this period it introduced flexible hours, raised salaries twice and opened an on-site gym. Before these changes, exit interviews showed that pay was the most common reason for leaving. Which inference is most strongly supported?`,o:[`The salary increases probably contributed to the fall in turnover.`,`The gym was the main reason turnover fell.`,`Turnover will continue to fall over the next five years.`,`Flexible hours had no effect on turnover.`],a:0,e:`Lương là lý do nghỉ việc phổ biến nhất và công ty đã tăng lương hai lần, nên "có lẽ đúng" rằng tăng lương góp phần làm giảm tỷ lệ nghỉ việc. Không có dữ kiện cho thấy phòng gym là nguyên nhân chính, cũng không thể khẳng định giờ linh hoạt không có tác dụng hay dự báo tương lai.`},
 {q:`[Recognition of assumptions] "Almost all the reviews on our website give our product five stars, so our customers must be satisfied with it." Which assumption is this argument most dependent on?`,o:[`The reviews on the website are representative of customers in general.`,`Five-star reviews on the website were written by paid reviewers.`,`The product is cheaper than its competitors.`,`Unhappy customers write longer reviews than happy ones.`],a:0,e:`Từ đánh giá trên website suy ra cho toàn bộ khách hàng thì phải giả định nhóm viết đánh giá đại diện cho khách hàng nói chung. Phương án 2 còn làm yếu lập luận; giá và độ dài đánh giá không liên quan.`},
 {q:`[Deduction] All members of the audit team have an accounting qualification. No interns have an accounting qualification. Which conclusion follows?`,o:[`No interns are members of the audit team.`,`Some interns are members of the audit team.`,`Everyone with an accounting qualification is on the audit team.`,`Some members of the audit team are interns.`],a:0,e:`Nếu một thực tập sinh ở trong nhóm kiểm toán thì người đó phải có chứng chỉ kế toán, mâu thuẫn với "không thực tập sinh nào có chứng chỉ". Vậy không thực tập sinh nào thuộc nhóm kiểm toán. Phương án 3 là đảo ngược mệnh đề, không được đảm bảo.`},
 {q:`[Deduction] If the client signs by Monday, the project will start on 1 June. If the project starts on 1 June, the team will hire two contractors. The team did not hire any contractors. Which conclusion follows?`,o:[`The client did not sign by Monday.`,`The client signed by Monday.`,`The project started on 1 June.`,`The team hired only one contractor.`],a:0,e:`Chuỗi điều kiện: ký trước thứ Hai → bắt đầu 1/6 → thuê hai nhà thầu. Không thuê nhà thầu nào nên dự án không bắt đầu 1/6, và vì vậy khách hàng không ký trước thứ Hai (phủ định hệ quả hai lần).`},
 {q:`[Interpretation] Between 2020 and 2025, the share of a company's revenue that came from online sales rose from 30% to 55%. The company's total revenue stayed roughly the same over the period. Which conclusion follows beyond reasonable doubt?`,o:[`Revenue from sales other than online sales fell between 2020 and 2025.`,`The number of online customers nearly doubled.`,`Online sales are more profitable than other sales.`,`The company closed some of its physical stores.`],a:0,e:`Tổng doanh thu gần như không đổi, phần không phải trực tuyến giảm từ 70% xuống 45% tổng, nên doanh thu ngoài kênh trực tuyến chắc chắn giảm. Số khách, lợi nhuận và việc đóng cửa hàng không suy ra được từ tỷ trọng doanh thu.`},
 {q:`[Evaluation of arguments] Should companies require all staff to complete annual cybersecurity training? Which argument is the strongest?`,o:[`Yes; most data breaches at similar companies began with staff clicking on phishing emails, and training has been shown to reduce such clicks.`,`Yes; cybersecurity is frequently in the news.`,`No; some staff already know a lot about computers.`,`No; the training would be delivered online.`],a:0,e:`Phương án đầu chỉ ra nguyên nhân chính của sự cố và bằng chứng rằng đào tạo xử lý được nó, vừa liên quan vừa quan trọng. Tin tức là lý do hời hợt; việc "một số" người đã giỏi không phải lý do để bỏ đào tạo cho tất cả; hình thức trực tuyến không liên quan.`},
 {q:`[Recognition of assumptions] "Our sales in the northern region fell after a competitor opened a store there, so we should cut our prices in the north to win back customers." Which assumption does this argument make?`,o:[`Price was at least part of the reason customers switched to the competitor.`,`The competitor will soon close its northern store.`,`Our northern store has a better location than the competitor's.`,`Our sales in the southern region rose last year.`],a:0,e:`Giảm giá chỉ giành lại khách nếu giá là (ít nhất một phần) lý do họ chuyển sang đối thủ. Nếu khách chuyển vì chất lượng hoặc vị trí, giảm giá có thể không hiệu quả. Các phương án khác không cần thiết cho lập luận.`},
 {q:`[Inference] A hospital found that patients discharged on Fridays were readmitted within 30 days more often than patients discharged on other weekdays. Follow-up appointments are usually arranged within two days of discharge, and the hospital has far fewer administrative staff at weekends. Which inference is most strongly supported?`,o:[`Reduced weekend staffing may make follow-up care harder to arrange for patients discharged on Fridays.`,`Patients discharged on Fridays are generally more seriously ill.`,`Readmission rates are the same whatever day patients are discharged.`,`The hospital will stop discharging patients on Fridays.`],a:0,e:`Hai ngày sau khi xuất viện thứ Sáu rơi vào cuối tuần, lúc ít nhân viên hành chính, nên "có lẽ đúng" rằng việc sắp xếp tái khám khó hơn. Mức độ bệnh không được nhắc đến; phương án 3 mâu thuẫn với dữ kiện; kế hoạch tương lai không có thông tin.`},
],
hard:[
 {q:`[Deduction] Every project that passes the security review is deployed on a Thursday. Some projects deployed on a Thursday are rolled back within a week. Project K passed the security review. Which conclusion must be true?`,o:[`Project K is deployed on a Thursday.`,`Project K is rolled back within a week.`,`Some projects that pass the security review are rolled back within a week.`,`Every project deployed on a Thursday has passed the security review.`],a:0,e:`K qua đánh giá bảo mật nên chắc chắn được triển khai vào thứ Năm. Các dự án bị rollback có thể là những dự án thứ Năm KHÔNG qua đánh giá bảo mật, nên phương án 2 và 3 không chắc chắn. Phương án 4 là đảo ngược mệnh đề.`},
 {q:`[Deduction] No one who works night shifts is eligible for the morning bonus. Everyone who is eligible for the morning bonus has worked at least one weekend this month. Hùng has worked a weekend this month. Which conclusion follows?`,o:[`It cannot be determined whether Hùng is eligible for the morning bonus.`,`Hùng is eligible for the morning bonus.`,`Hùng does not work night shifts.`,`Hùng works night shifts.`],a:0,e:`"Đủ điều kiện → đã làm cuối tuần" không cho phép suy ngược "đã làm cuối tuần → đủ điều kiện" (lỗi khẳng định hệ quả). Vì không biết Hùng có đủ điều kiện không, cũng không suy ra được Hùng có làm ca đêm hay không.`},
 {q:`[Recognition of assumptions] "Our new hiring test predicts job performance well: the employees who scored highest on it last year received the best performance ratings this year." Which assumption is this argument most dependent on?`,o:[`The performance ratings were not influenced by managers knowing the employees' test scores.`,`The new test is shorter than the old one.`,`The new test cost more than the previous one.`,`Competitors use a similar hiring test.`],a:0,e:`Nếu quản lý biết điểm test và vô tình chấm hiệu suất theo đó, mối tương quan không chứng minh bài test dự báo tốt. Lập luận ngầm giả định điểm đánh giá hiệu suất độc lập với điểm test. Độ dài, chi phí hay việc đối thủ dùng test không liên quan.`},
 {q:`[Inference] A retailer's winter jacket sales in the southern region were higher in December 2025 than in any December in the previous ten years. December 2025 was also the coldest December on record in the south. The retailer did not change its prices or advertising during 2025. Which inference is most strongly supported?`,o:[`The unusually cold weather probably contributed to the higher jacket sales.`,`Jacket sales in the south will be just as high next December.`,`The retailer's jacket sales in the northern region also reached a record.`,`The retailer cut its jacket prices in December 2025.`],a:0,e:`Giá và quảng cáo không đổi, tháng 12 lạnh kỷ lục trùng với doanh số kỷ lục, nên thời tiết "có lẽ" là một nguyên nhân. Dự báo năm sau và doanh số miền Bắc không có thông tin; phương án 4 mâu thuẫn với dữ kiện giá không đổi.`},

const AKEY='cogmock.attempts',HMAX=500;
/* Chi tiết từng bài (đề, đáp án, thời gian) nằm trong IndexedDB vì localStorage chỉ chứa được vài bài.
   ATT là bản sao trong bộ nhớ; ghi xuống IndexedDB chạy nền. Trình duyệt không có IndexedDB thì quay về localStorage. */
let ATT=[],useIDB=false,dbP=null;
function idb(mode,fn){
  dbP=dbP||new Promise((res,rej)=>{const r=indexedDB.open('cogmock',1);r.onupgradeneeded=()=>r.result.createObjectStore('attempts',{keyPath:'id'});r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)});
  return dbP.then(db=>new Promise((res,rej)=>{const t=db.transaction('attempts',mode),q=fn(t.objectStore('attempts'));t.oncomplete=()=>res(q&&q.result);t.onerror=t.onabort=()=>rej(t.error)}));
}
function lsAttempts(){try{return JSON.parse(localStorage.getItem(AKEY))||[]}catch(e){return[]}}
function lsSave(){let l=ATT.slice(0,15);while(l.length){try{localStorage.setItem(AKEY,JSON.stringify(l));break}catch(e){l=l.slice(0,-1)}}}
async function initAttempts(){
  const legacy=lsAttempts();
  try{
    if(!window.indexedDB)throw 0;
    if(legacy.length)await idb('readwrite',st=>{legacy.forEach(a=>st.put(a))});
    ATT=await idb('readonly',st=>st.getAll());useIDB=true;
    if(legacy.length)try{localStorage.removeItem(AKEY)}catch(e){}
  }catch(e){ATT=legacy;useIDB=false}
  ATT.sort((a,b)=>b.t-a.t);
}
function loadAttempts(){return ATT}
function saveAttempt(a){
  ATT=[a,...ATT.filter(x=>x.id!==a.id)].sort((x,y)=>y.t-x.t);
  const drop=ATT.slice(HMAX);ATT=ATT.slice(0,HMAX);
  if(useIDB)idb('readwrite',st=>{st.put(a);drop.forEach(x=>st.delete(x.id))}).catch(()=>{});else lsSave();
}
function deleteAttempt(id){ATT=ATT.filter(x=>x.id!==id);if(useIDB)idb('readwrite',st=>{st.delete(id)}).catch(()=>{});else lsSave()}
function clearAttempts(){ATT=[];if(useIDB)idb('readwrite',st=>{st.clear()}).catch(()=>{});try{localStorage.removeItem(AKEY)}catch(e){}}
/* Lịch sử gọn: chỉ lưu điểm từng phần nên giữ được nhiều lần làm hơn bản chi tiết ở trên. */
const HKEY='cogmock.history';
const summarize=a=>({id:a.id,t:a.t,name:a.name||'',kind:a.kind||'test',early:!!a.early,label:a.label,level:a.level,
  secs:a.sections.map(s=>({key:s.key,c:s.qs.filter((q,i)=>s.answers[i]===q.ans).length,n:s.qs.length,used:s.used,secs:s.secs}))});
function saveHistory(h){try{localStorage.setItem(HKEY,JSON.stringify(h.sort((a,b)=>b.t-a.t).slice(0,HMAX)))}catch(e){}}
function loadHistory(){
  let raw=null;try{raw=localStorage.getItem(HKEY)}catch(e){return[]}
  if(raw!==null){try{return JSON.parse(raw)||[]}catch(e){return[]}}
  const h=loadAttempts().map(summarize);saveHistory(h);return h;
}
function addHistory(e){saveHistory([e,...loadHistory().filter(x=>x.id!==e.id)])}
function removeHistory(id){saveHistory(loadHistory().filter(x=>x.id!==id));deleteAttempt(id);deleteRemote(id)}
function clearHistory(){clearAttempts();try{localStorage.setItem(HKEY,'[]')}catch(e){}}
const hScore=e=>e.secs.reduce((a,s)=>({c:a.c+s.c,n:a.n+s.n}),{c:0,n:0});
const pctOf=(c,n)=>n?Math.round(c/n*100):0;
function cleanEntry(e){
  if(!e||typeof e!=='object'||!Array.isArray(e.secs)||!Number.isFinite(+e.t))return null;
  const secs=e.secs.filter(s=>s&&SECTIONS.some(d=>d.key===s.key)).map(s=>({key:s.key,c:Math.max(0,+s.c|0),n:Math.max(0,+s.n|0),used:+s.used||0,secs:+s.secs||0})).filter(s=>s.n);
  return secs.length?{id:String(e.id||e.t),t:+e.t,kind:e.kind==='review'?'review':'test',early:!!e.early,name:String(e.name||'').slice(0,40),label:String(e.label||'Bài làm'),level:LEVELS[e.level]?e.level:'mixed',secs}:null;
}
/* Đồng bộ lên server (Vercel Blob qua /api/attempts). Mở trực tiếp bằng file:// thì chỉ lưu trên máy.
   Bài nào chưa gửi được nằm trong hàng đợi và được gửi lại ở lần mở trang sau hoặc khi có mạng. */
const API='/api/attempts',HAS_API=location.protocol.startsWith('http');
const PKEY='cogmock.pending',DKEY='cogmock.device',BKEY='cogmock.backfilled';
let REMOTE={status:HAS_API?'idle':'off',items:[],at:0},syncing=null;
function deviceKey(){
  try{let k=localStorage.getItem(DKEY);
    if(!k){k=crypto.randomUUID?crypto.randomUUID():Array.from(crypto.getRandomValues(new Uint8Array(16)),b=>b.toString(16).padStart(2,'0')).join('');localStorage.setItem(DKEY,k)}
    return k}catch(e){return'tam-thoi-'+Date.now()+'-'+Math.random().toString(36).slice(2)}
}
function getPending(){try{return JSON.parse(localStorage.getItem(PKEY))||[]}catch(e){return[]}}
function setPending(l){try{localStorage.setItem(PKEY,JSON.stringify([...new Set(l)]))}catch(e){}}
function queueUpload(id){setPending([...getPending(),id]);syncPending()}
function syncPending(){
  if(!HAS_API)return Promise.resolve();
  if(syncing)return syncing;
  syncing=(async()=>{
    await null; // để syncing được gán trước khi finally chạy
    try{for(const id of getPending()){
      const a=ATT.find(x=>x.id===id),drop=()=>setPending(getPending().filter(x=>x!==id));
      if(!a){drop();continue}
      const r=await fetch(API,{method:'POST',headers:{'content-type':'application/json','x-device-key':deviceKey()},body:JSON.stringify(a)});
      // 400/409/413: server không nhận bài này, gửi lại cũng vậy nên bỏ khỏi hàng đợi
      if(r.ok||[400,409,413].includes(r.status))drop();else break;
    }}catch(e){}finally{syncing=null}
  })();
  return syncing;
}
function backfillUploads(){
  try{if(localStorage.getItem(BKEY))return;localStorage.setItem(BKEY,'1')}catch(e){return}
  setPending([...getPending(),...ATT.map(a=>a.id)]);
}
async function fetchRemote(){
  if(!HAS_API)return;
  REMOTE.status='loading';
  try{const r=await fetch(API);if(!r.ok)throw 0;const d=await r.json();
    REMOTE={status:'ok',items:(d.items||[]).map(cleanEntry).filter(Boolean),at:Date.now()}}
  catch(e){REMOTE.status='error'}
}
async function getDetail(id){
  const a=ATT.find(x=>x.id===id);if(a)return a;
  if(!HAS_API)return null;
  try{const r=await fetch(API+'?id='+encodeURIComponent(id));return r.ok?await r.json():null}catch(e){return null}
}
function deleteRemote(id){
  setPending(getPending().filter(x=>x!==id));REMOTE.items=REMOTE.items.filter(x=>x.id!==id);
  if(HAS_API)fetch(API+'?id='+encodeURIComponent(id),{method:'DELETE',headers:{'x-device-key':deviceKey()}}).catch(()=>{});
}
const NKEY='cogmock.name';
function getName(){try{return(localStorage.getItem(NKEY)||'').trim()}catch(e){return''}}
function setName(n){try{localStorage.setItem(NKEY,n.trim().slice(0,40))}catch(e){}}

function saveRun(){

}
function loadRun(){

const qKey=q=>q.type+'|'+(q.type==='abs'?JSON.stringify([q.seq,q.grid,q.opts]):q.type==='verb'?q.passage+'|'+q.statement:q.q);
function wrongPool(atts){
  const last=new Map();
  [...atts].sort((a,b)=>a.t-b.t).forEach(a=>a.sections.forEach(s=>s.qs.forEach((q,i)=>last.set(qKey(q),{key:s.key,q,ok:s.answers[i]===q.ans}))));
  return[...last.values()].filter(x=>!x.ok);
}

      return`<div class="secres"><b>${d.name}</b><span style="font-variant-numeric:tabular-nums">${c}/${s.qs.length}</span><div class="meter"><i style="width:${c/s.qs.length*100}%"></i></div><span class="muted" style="font-size:.9rem;grid-column:1/-1">Dùng ${mmss(s.used)} / ${mmss(s.secs)} · trung bình ${avg} giây mỗi câu (gợi ý: ${Math.round(s.secs/s.qs.length)} giây)</span></div>`}).join('')}
    <div class="statgrid">
      ${['easy','medium','hard'].filter(l=>lvStats[l][1]).map(l=>`<div class="stat"><b>${lvStats[l][0]}/${lvStats[l][1]}</b><span>Câu ${LEVELS[l].toLowerCase()}</span></div>`).join('')}
      <div class="stat"><b>${skipped}</b><span>Chưa trả lời</span></div>
      <div class="stat"><b>${mmss(used)}</b><span>Tổng thời gian / ${mmss(total)}</span></div>
    </div>
    <div class="row" style="margin-top:20px">${sc.c<sc.n?`<button class="btn" id="reviewThis">Ôn ${sc.n-sc.c} câu sai của bài này</button>`:''}<button class="btn${sc.c<sc.n?' ghost':''}" id="again">${att.kind==='review'?'Ôn tiếp câu sai':'Làm đề mới cùng cấu trúc'}</button><button class="btn ghost" id="retryBtn">Làm lại đúng đề này</button><button class="btn ghost" id="homeBtn">Về trang chính</button><button class="btn ghost" id="listBtn">Lịch sử</button></div>
  </section>
  <div class="controls">
    <div class="chips" role="group" aria-label="Chọn phần">${att.sections.length>1?`<button data-sec="all" aria-pressed="true">Tất cả phần</button>`:''}${att.sections.map((s,k)=>`<button data-sec="${s.key}" aria-pressed="${att.sections.length===1}">${secDef(s.key).name}</button>`).join('')}</div>
    <div class="chips" role="group" aria-label="Lọc câu">${[['all','Tất cả'],['bad','Sai'],['skip','Chưa trả lời'],['ok','Đúng']].map(([k,v])=>`<button data-f="${k}" aria-pressed="${k==='all'}">${v}</button>`).join('')}</div>
  </div>
  <div id="list"></div>`;
  if(att.sections.length===1)view.sec=att.sections[0].key;
  const opt=(q,a,j,inner)=>`<li class="${j===q.ans?'is-ans':''} ${j===a&&j!==q.ans?'is-wrong':''}"><span class="k">${'ABCD'[j]}</span>${inner}${j===q.ans?'<em>Đáp án đúng</em>':j===a?'<em>Bạn chọn</em>':''}</li>`;
  const card=(s,i)=>{
    const q=s.qs[i],a=s.answers[i],st=status(s,i),t=s.times[i];
    const resTxt=st==='ok'?'Đúng':st==='bad'?'Sai':(t===null?(att.early?'Chưa làm':'Hết giờ, chưa làm'):'Bỏ qua');
    let body='';
    if(q.type==='abs')body=`<p style="margin-bottom:8px"><b>${ABS_TEXT[q.form]||'Which figure comes next?'}</b></p><div class="mini">${absStem(q)}</div>
      <ul class="ro abs">${q.opts.map((o,j)=>opt(q,a,j,`<div class="panel">${panelSVG(o)}</div>`)).join('')}</ul>`;
    else{
      if(q.type==='verb')body=`<div class="mini"><div class="passage">${esc(q.passage)}</div></div><p style="margin:0"><b>${esc(q.statement)}</b></p>`;
      else body=`<p style="margin:0"><b>${esc(q.q)}</b></p>`+(q.table?`<div class="tablewrap" style="margin-top:10px"><table class="data"><thead><tr>${q.table.head.map(x=>`<th>${esc(x)}</th>`).join('')}</tr></thead><tbody>${q.table.rows.map(r=>`<tr>${r.map(x=>`<td>${esc(x)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`:'');
      body+=`<ul class="ro">${q.opts.map((o,j)=>opt(q,a,j,`<span>${esc(o)}</span>`)).join('')}</ul>`;
    }
    return`<article class="qcard st-${st}" id="q-${s.key}-${i}">
      <div class="qhead"><span>${secDef(s.key).name} · Câu ${i+1} · ${LEVELS[q.level]}${t!==null?` · ${t} giây`:''}</span><span class="res ${st}">${resTxt}</span></div>
      ${body}
      <div class="why"><p><b>Giải thích:</b> ${esc(q.exp)}</p>${st!=='ok'?`<p class="tip">Mẹo: ${TIPS[s.key]}</p>`:''}</div>
    </article>`;
  };
  const draw=()=>{
    const secs=att.sections.filter(s=>view.sec==='all'||s.key===view.sec);
    let html='',count=0;
    for(const s of secs){
      const idx=s.qs.map((_,i)=>i).filter(i=>view.filter==='all'||status(s,i)===view.filter);
      html+=`<h3 style="margin-top:22px">${secDef(s.key).name}</h3>
        <div class="navgrid" aria-label="Danh sách câu">${s.qs.map((_,i)=>`<button class="st-${status(s,i)}" data-go="q-${s.key}-${i}" aria-label="Câu ${i+1}">${i+1}</button>`).join('')}</div>`;
      html+=idx.length?idx.map(i=>card(s,i)).join(''):`<p class="empty">Không có câu nào khớp bộ lọc này.</p>`;
      count+=idx.length;
    }
    const list=document.getElementById('list');list.innerHTML=html;
    list.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>{let el=document.getElementById(b.dataset.go);
      if(!el){view.filter='all';app.querySelectorAll('[data-f]').forEach(x=>x.setAttribute('aria-pressed',x.dataset.f==='all'));draw();el=document.getElementById(b.dataset.go)}
      el.scrollIntoView({behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth'})});
  };
  app.querySelectorAll('[data-sec]').forEach(b=>b.onclick=()=>{view.sec=b.dataset.sec;app.querySelectorAll('[data-sec]').forEach(x=>x.setAttribute('aria-pressed',x===b));draw()});
  app.querySelectorAll('[data-f]').forEach(b=>b.onclick=()=>{view.filter=b.dataset.f;app.querySelectorAll('[data-f]').forEach(x=>x.setAttribute('aria-pressed',x===b));draw()});
  draw();
  document.getElementById('retryBtn').onclick=()=>retryAttempt(att);
  const rt=document.getElementById('reviewThis');if(rt)rt.onclick=()=>startReview(wrongPool([att]));
  document.getElementById('again').onclick=()=>{if(att.kind==='review'){const w=wrongPool(loadAttempts());if(w.length)startReview(w);else{alert('Không còn câu sai nào để ôn.');home()}return}level=att.level;start(SECTIONS.filter(d=>att.sections.some(s=>s.key===d.key)).map(d=>({def:d,qs:build(d,att.level),secs:d.minutes*60})),att.label)};
  document.getElementById('homeBtn').onclick=home;
  document.getElementById('listBtn').onclick=historyView;
  window.scrollTo(0,0);
}

const GUIDE=[
{key:'all',name:'Mẹo chung',vi:'Áp dụng cho cả 4 phần',
 intro:`Đề cognitive không cần kiến thức chuyên môn. Thứ được đo là <b>tốc độ</b> và <b>độ chính xác</b> khi xử lý thông tin dưới áp lực thời gian. Phần lớn điểm bị mất không phải vì câu khó, mà vì đọc vội, kẹt quá lâu ở một câu, hoặc rơi vào bẫy quen thuộc.`,

{key:'num',name:'Numerical Reasoning',vi:'Suy luận số học',

  `<b>Kiểm tra lại câu hỏi</b> trước khi chọn: hỏi số tiền hay phần trăm, tăng hay giảm, năm nào.`],
 types:[

   sol:[`Alpha: +120 ÷ 800 = 15%.`,`Beta: +60 ÷ 200 = 30%.`,`Gamma: +150 ÷ 1.500 = 10%.`,`Đáp án <b>Beta</b>.`],

{key:'verb',name:'Verbal Reasoning',vi:'Suy luận ngôn ngữ',
 intro:`Bạn đọc một đoạn văn ngắn rồi đánh giá một câu là <b>True</b>, <b>False</b> hay <b>Cannot say</b>. Bài này không kiểm tra bạn hiểu biết bao nhiêu, mà kiểm tra bạn có <b>chỉ dựa vào đoạn văn</b> hay không.`,
 steps:[`Đọc câu cần đánh giá trước, rồi tìm câu tương ứng trong đoạn văn.`,
  `Hỏi: đoạn văn có <b>nói thẳng hoặc chắc chắn suy ra</b> điều này không? Có thì chọn <b>True</b>.`,
  `Nếu không: đoạn văn có <b>nói điều ngược lại</b> không? Có thì chọn <b>False</b>.`,
  `Cả hai đều không thì chọn <b>Cannot say</b>. Không có thông tin không có nghĩa là False.`,
  `Quên hết kiến thức bên ngoài, kể cả những điều bạn biết chắc là đúng ngoài đời.`],
 types:[
  {t:'Nói thẳng hoặc diễn đạt lại → True',

  {t:'Mâu thuẫn trực tiếp → False',

   ex:`<div class="passage">FreshCart's average delivery time increased from 45 to 55 minutes.</div><p><b>Statement:</b> FreshCart deliveries became faster.</p>`,
