<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Thi thử Cognitive Test</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#F4F7FB; --grid:#E2EAF3; --card:#FFFFFF; --line:#C8D4E2;
  --ink:#1D3F8F; --ink-soft:#4C67AE; --text:#232830; --muted:#5B6574;
  --mark:#FFE36E; --mark-text:#232830; --ok:#1F7A4A; --bad:#BF3530; --ok-bg:#E3F3EA; --bad-bg:#FBE6E4;
  --display:"Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --body:"Source Sans 3", "Segoe UI", system-ui, -apple-system, sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#11171F; --grid:#1A222D; --card:#18202A; --line:#2C3847;
    --ink:#91B1FF; --ink-soft:#6F8FD9; --text:#E5E9EF; --muted:#9AA5B4;
    --mark:#E9C84A; --mark-text:#17140A; --ok:#53C98E; --bad:#F27A70; --ok-bg:#16301F; --bad-bg:#3A1C1A;
  }
}
:root[data-theme="dark"]{
  --paper:#11171F; --grid:#1A222D; --card:#18202A; --line:#2C3847;
  --ink:#91B1FF; --ink-soft:#6F8FD9; --text:#E5E9EF; --muted:#9AA5B4;
  --mark:#E9C84A; --mark-text:#17140A; --ok:#53C98E; --bad:#F27A70; --ok-bg:#16301F; --bad-bg:#3A1C1A;
}
*,*::before,*::after{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{min-height:100%}
body{
  margin:0; color:var(--text); font-family:var(--body); font-size:17px; line-height:1.55;
  background-color:var(--paper);
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:24px 24px;
}
.wrap{max-width:860px; margin:0 auto; padding:28px 20px 64px}
h1,h2,h3{font-family:var(--display); color:var(--ink); margin:0; line-height:1.1}
h1{font-size:clamp(2.2rem,6vw,3.6rem); font-weight:800; letter-spacing:-0.02em}
h2{font-size:1.6rem; font-weight:700}
h3{font-size:1.15rem; font-weight:700}
p{margin:0 0 .8em}
.lead{font-size:1.15rem; color:var(--muted); max-width:60ch; margin-top:14px}
button{font:inherit; cursor:pointer}
:focus-visible{outline:3px solid var(--ink); outline-offset:3px}
.btn{border:2px solid var(--ink); background:var(--ink); color:var(--card); padding:12px 22px; border-radius:10px; font-weight:700; font-size:1rem}
.btn:hover{filter:brightness(1.08)}
.btn:disabled{opacity:.35; cursor:not-allowed}
.btn.ghost{background:transparent; color:var(--ink)}
.btn.small{padding:7px 14px; font-size:.92rem}
.sheet{background:var(--card); border:1.5px solid var(--line); border-radius:14px; padding:24px}
.muted{color:var(--muted)}

/* Home */
.hero{padding:24px 0 30px}
.levels{display:flex; flex-wrap:wrap; gap:8px; margin:10px 0 0}
.levels button{border:2px solid var(--line); background:var(--card); color:var(--text); border-radius:999px; padding:8px 16px; font-weight:600}
.levels button[aria-pressed="true"]{border-color:var(--ink); background:var(--mark); color:var(--mark-text)}
.structure{width:100%; border-collapse:collapse; margin:6px 0 20px}
.structure td{padding:12px 6px; border-bottom:1px solid var(--line); vertical-align:middle}
.structure tr:last-child td{border-bottom:0}
.structure .n{font-family:var(--display); font-weight:800; color:var(--ink-soft); width:34px; font-size:1.2rem}
.structure .name{font-weight:700}
.structure .vi{display:block; color:var(--muted); font-size:.92rem; font-weight:400}
.structure .meta{color:var(--muted); white-space:nowrap; text-align:right; font-variant-numeric:tabular-nums}
.structure .act{text-align:right; width:1%}
.row{display:flex; flex-wrap:wrap; gap:12px; align-items:center}
.section-gap{margin-top:28px}
.notes{margin:0; padding-left:1.1em; color:var(--muted)}
.notes li{margin:4px 0}
.hist{width:100%; border-collapse:collapse; font-size:.95rem; font-variant-numeric:tabular-nums}
.hist td{padding:6px 4px; border-bottom:1px dashed var(--line)}

/* Test screen */
.bar{display:flex; justify-content:space-between; align-items:flex-end; gap:16px; padding-bottom:12px; border-bottom:2px solid var(--ink)}
.bar .sec{font-family:var(--display); font-weight:700; color:var(--ink); font-size:1.15rem}
.bar .count{color:var(--muted); font-variant-numeric:tabular-nums}
.timer{font-family:var(--display); font-weight:800; font-size:clamp(2.4rem,8vw,3.6rem); line-height:.9; color:var(--ink); font-variant-numeric:tabular-nums; letter-spacing:-0.02em}
.timer.low{color:var(--bad)}
.progress{height:4px; background:var(--line); margin-top:-2px}
.progress i{display:block; height:100%; background:var(--ink-soft); transition:width .3s}
.qbody{padding:26px 0 10px}
.tag{display:inline-block; font-size:.85rem; color:var(--muted); border:1px solid var(--line); border-radius:6px; padding:1px 8px; margin-bottom:12px}
.qtext{font-size:1.2rem; font-weight:600; margin-bottom:18px; max-width:68ch}
.passage{background:var(--card); border-left:4px solid var(--ink); padding:16px 18px; border-radius:0 10px 10px 0; margin-bottom:18px; max-width:72ch}
.stmt{font-size:1.15rem; font-weight:700; margin-bottom:16px; max-width:68ch}
.opts{display:grid; gap:10px; max-width:640px}
.opt{display:flex; gap:12px; align-items:center; text-align:left; width:100%; background:var(--card); color:var(--text); border:2px solid var(--line); border-radius:10px; padding:12px 14px}
.opt .k{flex:none; width:28px; height:28px; border-radius:50%; border:2px solid var(--ink-soft); display:grid; place-items:center; font-weight:700; color:var(--ink); font-size:.9rem}
.opt:hover{border-color:var(--ink-soft)}
.opt[aria-checked="true"]{border-color:var(--ink); background:linear-gradient(100deg,transparent 0 6px,var(--mark) 6px calc(100% - 4px),transparent calc(100% - 4px)); color:var(--mark-text)}
.opt[aria-checked="true"] .k{background:var(--ink); color:var(--card); border-color:var(--ink)}
table.data{border-collapse:collapse; margin:0 0 18px; font-variant-numeric:tabular-nums; background:var(--card)}
table.data th,table.data td{border:1px solid var(--line); padding:7px 14px; text-align:right}
table.data th:first-child,table.data td:first-child{text-align:left}
table.data th{color:var(--ink); font-weight:700}
.tablewrap{overflow-x:auto; max-width:100%}
.seq{display:grid; grid-template-columns:repeat(5,minmax(0,1fr)); gap:8px; max-width:520px; margin-bottom:22px}
.panel{background:var(--card); border:1.5px solid var(--line); border-radius:8px; color:var(--text); aspect-ratio:1; display:grid; place-items:center}
.panel svg{width:100%; height:100%; display:block}
.panel.q{border-style:dashed; border-color:var(--ink-soft); font-family:var(--display); font-weight:800; font-size:2rem; color:var(--ink-soft)}
.aopts{display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:10px; max-width:520px}
.aopt{background:var(--card); border:2px solid var(--line); border-radius:10px; padding:6px; color:var(--text); display:flex; flex-direction:column; align-items:center; gap:2px}
.aopt .k{font-weight:700; color:var(--ink); font-size:.95rem}
.aopt .panel{border:0; width:100%}
.aopt[aria-checked="true"]{border-color:var(--ink); background:var(--mark); color:var(--mark-text)}
.aopt[aria-checked="true"] .panel{background:transparent; color:var(--mark-text)}
.foot{display:flex; justify-content:space-between; align-items:center; gap:12px; padding-top:22px; margin-top:18px; border-top:1px solid var(--line)}
.kbd{font-size:.85rem; color:var(--muted)}

/* Results */
.score{font-family:var(--display); font-weight:800; font-size:clamp(3.5rem,14vw,6rem); color:var(--ink); line-height:1; letter-spacing:-0.03em; font-variant-numeric:tabular-nums}
.secres{display:grid; grid-template-columns:1fr auto; gap:4px 16px; align-items:baseline; padding:12px 0; border-bottom:1px solid var(--line)}
.secres .meter{grid-column:1/-1; height:8px; background:var(--line); border-radius:4px; overflow:hidden}
.secres .meter i{display:block; height:100%; background:var(--ink)}
details.review{border-top:1px solid var(--line); padding:10px 0}
details.review summary{cursor:pointer; font-weight:700; color:var(--ink); font-family:var(--display); font-size:1.1rem}
.ritem{padding:14px 0; border-bottom:1px dashed var(--line)}
.ritem:last-child{border-bottom:0}
.ritem .res{font-weight:700}
.ritem .res.ok{color:var(--ok)} .ritem .res.bad{color:var(--bad)}
.ritem .exp{background:var(--paper); border-radius:8px; padding:10px 12px; margin-top:8px; font-size:.97rem}
.mini .seq{max-width:340px; margin-bottom:8px}
.mini .panel.q{font-size:1.2rem}
.mini .passage{font-size:.95rem; padding:10px 12px}
/* Result detail */
.statgrid{display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:10px; margin-top:16px}
.stat{border:1.5px solid var(--line); border-radius:10px; padding:10px 12px; background:var(--card)}
.stat b{display:block; font-family:var(--display); font-size:1.4rem; color:var(--ink); font-variant-numeric:tabular-nums}
.stat span{font-size:.9rem; color:var(--muted)}
.controls{position:sticky; top:env(safe-area-inset-top,0px); z-index:5; background:var(--paper); padding:12px 0 10px; border-bottom:1px solid var(--line); margin-top:26px}
.chips{display:flex; gap:6px; overflow-x:auto; padding-bottom:4px}
.chips button{flex:none; border:1.5px solid var(--line); background:var(--card); color:var(--text); border-radius:999px; padding:5px 12px; font-size:.92rem; font-weight:600}
.chips button[aria-pressed="true"]{border-color:var(--ink); background:var(--ink); color:var(--card)}
.chips + .chips{margin-top:6px}
.navgrid{display:flex; flex-wrap:wrap; gap:5px; margin:14px 0 4px}
.navgrid button{width:32px; height:32px; border-radius:6px; border:1.5px solid var(--line); background:var(--card); color:var(--text); font-size:.82rem; font-weight:700; font-variant-numeric:tabular-nums; padding:0}
.navgrid .st-ok{background:var(--ok-bg); border-color:var(--ok); color:var(--ok)}
.navgrid .st-bad{background:var(--bad-bg); border-color:var(--bad); color:var(--bad)}
.navgrid .st-skip{border-style:dashed; color:var(--muted)}
.qcard{background:var(--card); border:1.5px solid var(--line); border-left:5px solid var(--line); border-radius:10px; padding:16px 18px; margin:14px 0; scroll-margin-top:150px}
.qcard.st-ok{border-left-color:var(--ok)} .qcard.st-bad{border-left-color:var(--bad)} .qcard.st-skip{border-left-style:dashed}
.qhead{display:flex; justify-content:space-between; gap:10px; flex-wrap:wrap; font-size:.92rem; color:var(--muted); margin-bottom:10px}
.qhead .res{font-weight:700} .res.ok{color:var(--ok)} .res.bad{color:var(--bad)} .res.skip{color:var(--muted)}
.ro{list-style:none; margin:10px 0 0; padding:0; display:grid; gap:6px}
.ro li{display:flex; gap:10px; align-items:center; border:1.5px solid var(--line); border-radius:8px; padding:7px 10px}
.ro .k{flex:none; font-weight:700; color:var(--ink); width:18px}
.ro em{margin-left:auto; font-style:normal; font-size:.82rem; font-weight:700; white-space:nowrap}
.ro .is-ans{border-color:var(--ok); background:var(--ok-bg)} .ro .is-ans em{color:var(--ok)}
.ro .is-wrong{border-color:var(--bad); background:var(--bad-bg)} .ro .is-wrong em{color:var(--bad)}
.ro.abs{grid-template-columns:repeat(4,minmax(0,1fr)); max-width:420px}
.ro.abs li{flex-direction:column; padding:4px; gap:0}
.ro.abs li .panel{border:0; width:100%; background:transparent}
.ro.abs em{margin:0; font-size:.72rem}
.why{margin-top:12px; padding:10px 12px; background:var(--paper); border-radius:8px}
.why p{margin:0}
.why .tip{margin-top:6px; font-size:.92rem; color:var(--muted)}
.empty{padding:28px 0; color:var(--muted)}
.trends{display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:10px; margin-top:16px}
.trend{border:1.5px solid var(--line); border-radius:10px; padding:10px 12px; background:var(--card); display:grid; grid-template-columns:1fr auto; gap:2px 12px; align-items:center}
.trend b{font-size:.98rem}
.trend .big{font-family:var(--display); font-size:1.4rem; color:var(--ink); font-variant-numeric:tabular-nums; text-align:right}
.trend .muted{font-size:.88rem; grid-column:1/-1}
.trend .delta{font-size:.88rem; font-weight:700}
.delta.up{color:var(--ok)} .delta.down{color:var(--bad)}
.spark{width:100%; max-width:220px; height:34px; grid-column:1/-1; display:block}
.spark line{stroke:var(--line); stroke-dasharray:3 3}
.spark polyline{fill:none; stroke:var(--ink); stroke-width:2; stroke-linejoin:round; stroke-linecap:round}
.spark circle{fill:var(--ink)}
.secmini{font-size:.86rem; color:var(--muted); font-variant-numeric:tabular-nums}
.hist .acts{white-space:nowrap; text-align:right; width:1%}
.hist .acts .btn + .btn{margin-left:6px}
.namefield{display:grid; gap:6px; margin-bottom:18px; max-width:380px}
.namefield span{font-weight:700; color:var(--ink)}
.namefield input{font:inherit; color:var(--text); background:var(--card); border:2px solid var(--line); border-radius:10px; padding:10px 12px}
.namefield input:focus{outline:none; border-color:var(--ink)}
.namefield input[aria-invalid="true"]{border-color:var(--bad)}
.namefield .err{color:var(--bad); font-size:.92rem}
.sheet.resume{border:2px solid var(--ink); margin-bottom:18px}
.sheet.resume h3{margin-bottom:4px}
.btn.danger{border-color:var(--bad); color:var(--bad)}
@media (max-width:560px){.trends{grid-template-columns:minmax(0,1fr)} .hist .secmini{display:none} .hist td{font-size:.9rem} .hist .acts .btn{display:block; width:100%; padding:6px 10px} .hist .acts .btn + .btn{margin:6px 0 0}}
@media (max-width:560px){.foot{flex-wrap:wrap} .foot .kbd{display:none} .foot #ok{flex:1 0 100%; order:-1}}
.attempts td{padding:9px 4px; border-bottom:1px dashed var(--line); vertical-align:middle}
@media (max-width:560px){.statgrid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:560px){
  .wrap{padding:18px 14px 48px}
  .structure .meta{font-size:.85rem}
  .aopts{gap:6px}
}
@media (prefers-reduced-motion: reduce){ *{transition:none!important} }
</style>
</head>
<body>
<main class="wrap" id="app" aria-live="polite"></main>

<script>
/* ---------- helpers ---------- */
const R=(a,b)=>Math.floor(Math.random()*(b-a+1))+a;
const pick=a=>a[Math.floor(Math.random()*a.length)];
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const fmt=n=>Number(n).toLocaleString('en-US',{maximumFractionDigits:2});
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function mc(correct,cands,f=fmt){
  const c0=f(correct),seen=new Set([c0]),opts=[c0];
  for(const c of shuffle(cands)){const s=f(c);if(!seen.has(s)&&opts.length<4){seen.add(s);opts.push(s)}}
  const step=Math.max(1,Math.round(Math.abs(correct)*0.1));let k=1;
  while(opts.length<4&&k<40){const s=f(correct+step*Math.ceil(k/2)*(k%2?1:-1));k++;if(!seen.has(s)){seen.add(s);opts.push(s)}}
  const sh=shuffle(opts);return{opts:sh,ans:sh.indexOf(c0)};
}
const signed=(v,unit='')=>(v>0?'+':v<0?'−':'')+fmt(Math.abs(v))+unit;

const SECTIONS=[
  {key:'num',name:'Numerical Reasoning',vi:'Suy luận số học',count:12,minutes:10,tip:'Được dùng giấy, bút và máy tính. Đọc kỹ đơn vị và đề hỏi giá trị nào.'},
  {key:'verb',name:'Verbal Reasoning',vi:'Suy luận ngôn ngữ',count:15,minutes:10,tip:'Chỉ dựa vào thông tin trong đoạn văn. Chọn Cannot say khi đoạn văn không đủ để kết luận đúng hay sai.'},
  {key:'abs',name:'Abstract Reasoning',vi:'Suy luận trừu tượng',count:50,minutes:10,tip:'Khoảng 12 giây mỗi câu. Tìm quy luật thay đổi của từng yếu tố: xoay, số cạnh, tô màu, số chấm, vị trí ô vuông.'},
  {key:'crit',name:'Critical Thinking',vi:'Tư duy phản biện',count:16,minutes:12,tip:'Gồm suy diễn, giả định ngầm, đánh giá lập luận. Kết luận phải chắc chắn đúng, không phải chỉ có vẻ hợp lý.'},
];
const LEVELS={easy:'Dễ',medium:'Trung bình',hard:'Khó',mixed:'Tăng dần'};

/* ---------- numerical ---------- */
const NUM={
easy:[
 ()=>{const p=pick([10,15,20,25,30,40,60]),y=R(2,30)*20,a=p*y/100;
  return{q:`What is ${p}% of ${fmt(y)}?`,...mc(a,[a*2,a/2,y-a,a+10]),exp:`${p}% × ${fmt(y)} = ${fmt(y)} × ${p/100} = ${fmt(a)}.`}},
 ()=>{const a=R(2,20),d=R(3,9),t=[0,1,2,3,4].map(i=>a+i*d),n=a+5*d;
  return{q:`What number comes next? ${t.join(', ')}, ?`,...mc(n,[n+d,n-1,n+1,n-d+1]),exp:`Mỗi số tăng thêm ${d}: ${t[4]} + ${d} = ${n}.`}},
 ()=>{const n=R(3,6),u=R(3,12)+pick([0,0.5]);let m=pick([7,8,9,10,12,15]);const p=n*u,a=m*u;
  return{q:`A pack of ${n} notebooks costs $${fmt(p)}. At the same price per notebook, how much do ${m} notebooks cost?`,...mc(a,[a+u,a-u,p+m,m*(u+1)],v=>'$'+fmt(v)),exp:`Giá mỗi cuốn: $${fmt(p)} ÷ ${n} = $${fmt(u)}. ${m} cuốn: ${m} × $${fmt(u)} = $${fmt(a)}.`}},
 ()=>{const pr=R(4,40)*10,d=pick([10,20,25,30]),a=pr*(100-d)/100;
  return{q:`A jacket costs $${pr}. It is on sale for ${d}% off. What is the sale price?`,...mc(a,[pr*d/100,pr-d,pr*(100+d)/100,a-10],v=>'$'+fmt(v)),exp:`Giảm ${d}% nghĩa là trả ${100-d}% giá gốc: $${pr} × ${(100-d)/100} = $${fmt(a)}.`}},
],
medium:[
 ()=>{const A=R(4,20)*100,inc=pick([12,15,18,24,35,40]),B=A*(100+inc)/100,wrong=Math.round((B-A)/B*1000)/10;
  return{q:`A shop's monthly revenue grew from $${fmt(A)} to $${fmt(B)}. What was the percentage increase?`,...mc(inc,[wrong,inc+5,inc-5,inc*2],v=>fmt(v)+'%'),exp:`Mức tăng $${fmt(B-A)}, chia cho giá trị ban đầu: ${fmt(B-A)} ÷ ${fmt(A)} = ${inc}%. Lỗi hay gặp là chia cho giá trị mới (ra ${wrong}%).`}},
 ()=>{const a=R(2,5),b=a+R(1,4),k=R(5,40)*10,T=(a+b)*k;
  return{q:`A bonus pool of $${fmt(T)} is split between two teams in the ratio ${a}:${b}. How much does the team with the larger share receive?`,...mc(b*k,[a*k,T/2,b*k+k,T-a*k-k],v=>'$'+fmt(v)),exp:`Tổng ${a+b} phần, mỗi phần $${fmt(T)} ÷ ${a+b} = $${fmt(k)}. Phần lớn hơn: ${b} × $${fmt(k)} = $${fmt(b*k)}.`}},
 ()=>{const s=R(1,10),d=R(1,4),c=pick([1,2]);const t=[s];for(let i=1;i<6;i++)t.push(t[i-1]+d+(i-1)*c);const sh=t.slice(0,5),n=t[5],diffs=sh.slice(1).map((v,i)=>v-sh[i]),ld=diffs[3];
  return{q:`What number comes next? ${sh.join(', ')}, ?`,...mc(n,[sh[4]+ld,n+c,n+1,n-1]),exp:`Khoảng cách giữa các số là ${diffs.join(', ')}, mỗi lần tăng thêm ${c}. Khoảng tiếp theo là ${ld+c}: ${sh[4]} + ${ld+c} = ${n}.`}},
 ()=>{const a=R(2,5),r=pick([2,3]),t=[0,1,2,3,4].map(i=>a*r**i),n=a*r**5;
  return{q:`What number comes next? ${t.join(', ')}, ?`,...mc(n,[t[4]+(t[4]-t[3]),n+a,n-r,t[4]*(r+1)]),exp:`Mỗi số nhân ${r}: ${t[4]} × ${r} = ${n}.`}},
 ()=>{const names=['Alpha','Beta','Gamma','Delta'];let rows,pc,best,bestAbs,ok,tries=0;

/* ---------- abstract ---------- */
function genAbs(level){
  const nr={easy:1,medium:2,hard:3}[level];let rules;
  do{rules=shuffle(['rot','sides','fill','dots','corner']).slice(0,nr)}while(rules.includes('rot')&&rules.includes('sides'));
  const P={};
  if(rules.includes('rot'))P.rot={start:pick([0,45,90,135,180,225,270,315]),step:pick(level==='easy'?[90]:level==='medium'?[45,90]:[45,135])*pick([1,-1])};
  if(rules.includes('sides'))P.sides=level==='hard'&&Math.random()<.5?{start:7,step:-1}:{start:3,step:1};
  if(rules.includes('fill'))P.fill={period:level==='hard'?pick([2,3]):2,phase:R(0,1)};
  if(rules.includes('dots'))P.dots=level==='hard'&&Math.random()<.5?{start:5,step:-1}:{start:1,step:1};
  if(rules.includes('corner'))P.corner={start:R(0,3),step:pick(level==='easy'?[1]:level==='medium'?[1,3]:[1,2,3])};
  const shape=P.sides?'poly':P.rot?'arrow':pick(['arrow','poly']);
  const base={sides:R(3,6),rot:shape==='arrow'?pick([0,90,180,270]):0,fill:Math.random()<.5,dots:level==='easy'?0:R(0,3),corner:level==='hard'?R(0,3):-1};
  const st=i=>({shape,
    sides:P.sides?P.sides.start+i*P.sides.step:base.sides,
    rot:P.rot?(((P.rot.start+i*P.rot.step)%360)+360)%360:base.rot,
    fill:P.fill?((i+P.fill.phase)%P.fill.period===0):base.fill,
    dots:P.dots?P.dots.start+i*P.dots.step:base.dots,
    corner:P.corner?(P.corner.start+i*P.corner.step)%4:base.corner});
  const seq=[0,1,2,3].map(st),A=st(4),m=o=>({...A,...o});
  const groups=[];
  if(P.rot)groups.push(shuffle([m({rot:(A.rot+P.rot.step+360)%360}),m({rot:(A.rot+180)%360}),m({rot:seq[3].rot})]));
  if(P.sides)groups.push(shuffle([m({sides:A.sides+1}),m({sides:Math.max(3,A.sides-1)})]));
  if(P.fill)groups.push([m({fill:!A.fill})]);
  if(P.dots)groups.push(shuffle([m({dots:A.dots+1}),m({dots:Math.max(0,A.dots-1)})]));
  if(P.corner)groups.push(shuffle([m({corner:(A.corner+1)%4}),m({corner:(A.corner+2)%4})]));
  const extra=shuffle([m({fill:!A.fill}),m({dots:A.dots+1}),shape==='arrow'?m({rot:(A.rot+90)%360}):m({sides:A.sides+1}),m({dots:Math.max(0,A.dots-1)})]);
  const key=s=>JSON.stringify(s),seen=new Set([key(A)]),ds=[];
  const add=s=>{if(ds.length<3&&!seen.has(key(s))){seen.add(key(s));ds.push(s)}};
  for(let r=0;r<3;r++)for(const g of groups)if(g[r])add(g[r]);
  extra.forEach(add);
  const opts=shuffle([A,...ds]);
  const dir=s=>s>0?'theo chiều kim đồng hồ':'ngược chiều kim đồng hồ';
  const ex=[];
  if(P.rot)ex.push(`mũi tên xoay ${dir(P.rot.step)} ${Math.abs(P.rot.step)}° mỗi bước`);
  if(P.sides)ex.push(`số cạnh của hình ${P.sides.step>0?'tăng':'giảm'} 1 mỗi bước`);
  if(P.fill)ex.push(P.fill.period===2?'hình xen kẽ tô đặc và để rỗng':'cứ 3 hình thì có 1 hình tô đặc');
  if(P.dots)ex.push(`số chấm ${P.dots.step>0?'tăng':'giảm'} 1 mỗi bước`);
  if(P.corner)ex.push(`ô vuông nhỏ ${P.corner.step===1?'đi 1 góc theo chiều kim đồng hồ':P.corner.step===3?'đi 1 góc ngược chiều kim đồng hồ':'nhảy sang góc đối diện'}`);
  const e=ex.join('; ');
  return{seq,opts,ans:opts.indexOf(A),exp:`Quy luật: ${e.charAt(0).toUpperCase()+e.slice(1)}.${ex.length>1?' Đáp án đúng phải thỏa mãn tất cả quy luật cùng lúc; mỗi phương án sai thường chỉ sai một yếu tố.':''}`};
}
function panelSVG(s){
  let g='';const fill=s.fill?'currentColor':'none';
  if(s.shape==='arrow'){
    g+=`<g transform="rotate(${s.rot} 50 46)"><path d="M50 22 L67 42 L56 42 L56 70 L44 70 L44 42 L33 42 Z" fill="${fill}" stroke="currentColor" stroke-width="3" stroke-linejoin="round"/></g>`;
  }else{
    const n=s.sides,pts=[];for(let i=0;i<n;i++){const a=(-90+i*360/n)*Math.PI/180;pts.push((50+23*Math.cos(a)).toFixed(1)+','+(48+23*Math.sin(a)).toFixed(1))}
    g+=`<polygon points="${pts.join(' ')}" fill="${fill}" stroke="currentColor" stroke-width="3" stroke-linejoin="round"/>`;
  }
  for(let i=0;i<s.dots;i++)g+=`<circle cx="${50-(s.dots-1)*4.5+i*9}" cy="88" r="2.8" fill="currentColor"/>`;
  if(s.corner>=0){const c=[[6,6],[86,6],[86,86],[6,86]][s.corner];g+=`<rect x="${c[0]}" y="${c[1]}" width="8" height="8" fill="currentColor"/>`}
  return`<svg viewBox="0 0 100 100" aria-hidden="true">${g}</svg>`;
}

/* ---------- critical thinking generators ---------- */
const NAMES=['An','Bình','Chi','Dũng','Hà','Khoa','Linh','Minh','Nga','Phúc'];
const cap=s=>s.charAt(0).toUpperCase()+s.slice(1);
const CATS=[['analysts','certified staff','people who can access the dashboard'],['interns','students','people eligible for the discount'],['drivers','contract workers','people who receive the fuel allowance'],['designers','creative staff','people who use Figma'],['managers','senior staff','people who attend the board meeting'],['engineers','remote workers','people who join the Friday call']];
const CONDS=[['the server is overloaded','the alert is triggered','the server is not overloaded','the alert is not triggered'],['it rains','the outdoor event is cancelled','it does not rain','the outdoor event is not cancelled'],['the budget is approved','the project starts in May','the budget is not approved','the project does not start in May'],['the printer is out of paper','the warning light is on','the printer is not out of paper','the warning light is not on'],['a director signs the form','the payment is released','no director signs the form','the payment is not released']];
function genCrit(lv){
  const k=pick({easy:['order','allA','mp'],medium:['order','someAll','mt'],hard:['order','noSome','ac','da']}[lv]);
  let q,o,e;
  if(k==='order'){
    const n={easy:3,medium:4,hard:5}[lv],pp=shuffle(NAMES).slice(0,n);
    const rel=pick([['is taller than','is shorter than','tallest','shortest','Từ cao đến thấp'],['is older than','is younger than','oldest','youngest','Từ lớn đến nhỏ tuổi'],['finished the race before','finished the race after','first','last','Thứ tự về đích']]);
    const race=rel[2]==='first';
    let clues=[];for(let i=0;i<n-1;i++)clues.push(Math.random()<.5?`${pp[i]} ${rel[0]} ${pp[i+1]}.`:`${pp[i+1]} ${rel[1]} ${pp[i]}.`);
    if(lv!=='easy')clues=shuffle(clues);
    const idx=lv==='easy'?pick([0,n-1]):lv==='medium'?pick([1,2]):pick([1,2,3]),ord=['','second','third','fourth'];
    const ask=race?`Who finished ${idx===0?'first':idx===n-1?'last':ord[idx]}?`:idx===0?`Who is the ${rel[2]}?`:idx===n-1?`Who is the ${rel[3]}?`:`Who is the ${ord[idx]} ${rel[2]}?`;
    q=clues.join(' ')+' '+ask;
    o=[pp[idx],...shuffle(pp.filter((_,i)=>i!==idx)).slice(0,3)];if(o.length<4)o.push('It cannot be determined.');
    e=`${rel[4]}: ${pp.join(', ')}.`;
  }else if(['allA','someAll','noSome'].includes(k)){
    const[A,B,Cc]=pick(CATS),nm=pick(NAMES);
    if(k==='allA'){q=`All ${A} are ${B}. ${nm} is one of the ${A}. Which conclusion follows?`;o=[`${nm} is one of the ${B}.`,`All ${B} are ${A}.`,`${nm} is not one of the ${B}.`,`It cannot be determined whether ${nm} is one of the ${B}.`];e=`Mọi người trong nhóm "${A}" đều thuộc "${B}", và ${nm} thuộc "${A}", nên ${nm} thuộc "${B}". Không suy ra được chiều ngược lại.`}
    if(k==='someAll'){q=`Some ${A} are ${B}. All ${B} are ${Cc}. Which conclusion must be true?`;o=[`Some ${A} are ${Cc}.`,`All ${A} are ${Cc}.`,`All ${Cc} are ${B}.`,`Some ${B} are not ${A}.`];e=`Những "${A}" thuộc "${B}" thì chắc chắn thuộc "${Cc}", nên ít nhất một số "${A}" thuộc "${Cc}". Các phương án khác không được đảm bảo.`}
    if(k==='noSome'){q=`No ${A} are ${B}. Some ${Cc} are ${A}. Which conclusion must be true?`;o=[`Some ${Cc} are not ${B}.`,`No ${Cc} are ${B}.`,`Some ${B} are ${Cc}.`,`All ${A} are ${Cc}.`];e=`Những "${Cc}" thuộc "${A}" thì chắc chắn không thuộc "${B}". Không biết gì về những "${Cc}" còn lại.`}
  }else{
    const[P,Q,nP,nQ]=pick(CONDS),rule=`If ${P}, ${Q}.`;
    if(k==='mp'){q=`${cap(rule)} Today, ${P}. Which conclusion follows?`;o=[cap(Q)+'.',cap(nQ)+'.','It cannot be determined.',cap(nP)+'.'];e=`Điều kiện đã xảy ra, nên kết quả chắc chắn xảy ra.`}
    if(k==='mt'){q=`${cap(rule)} Today, ${nQ}. Which conclusion follows?`;o=[cap(nP)+'.',cap(P)+'.','It cannot be determined.',cap(Q)+'.'];e=`Phủ định hệ quả: nếu điều kiện xảy ra thì kết quả phải xảy ra; kết quả không xảy ra nên điều kiện cũng không xảy ra.`}
    if(k==='ac'){q=`${cap(rule)} Today, ${Q}. Which conclusion follows?`;o=[`It cannot be determined whether ${P}.`,cap(P)+'.',cap(nP)+'.',cap(nQ)+'.'];e=`Lỗi khẳng định hệ quả: kết quả xảy ra có thể do nguyên nhân khác, nên không kết luận được về điều kiện.`}
    if(k==='da'){q=`${cap(rule)} Today, ${nP}. Which conclusion follows?`;o=[`It cannot be determined whether ${Q}.`,cap(nQ)+'.',cap(Q)+'.',cap(P)+'.'];e=`Lỗi phủ định tiền đề: điều kiện không xảy ra không có nghĩa là kết quả cũng không xảy ra.`}
  }
  const sh=shuffle(o.map((t,i)=>({t,i})));
  return{type:'crit',q,opts:sh.map(x=>x.t),ans:sh.findIndex(x=>x.i===0),exp:e,level:lv};
}
function critPool(lv,n){
  const out=critItems(lv).slice(0,n),seen=new Set(out.map(x=>x.q));let t=0;
  while(out.length<n&&t<200){const g=genCrit(lv);t++;if(!seen.has(g.q)){seen.add(g.q);out.push(g)}}
  return shuffle(out);
}

/* ---------- build question sets ---------- */
const lvAt=(i,n,level)=>level!=='mixed'?level:(i<Math.round(n/3)?'easy':i<Math.round(2*n/3)?'medium':'hard');
const FALLBACK={easy:['easy','medium','hard'],medium:['medium','easy','hard'],hard:['hard','medium','easy']};
const split=n=>{const e=Math.round(n/3),m=Math.round(n/3);return{easy:e,medium:m,hard:n-e-m}};
function verbItems(lv){return shuffle(VERB[lv]).flatMap(p=>p.s.map(s=>({type:'verb',passage:p.p,statement:s[0],opts:[T,F,C],ans:[T,F,C].indexOf(s[1]),exp:s[2],level:lv})))}
function critItems(lv){return shuffle(CRIT[lv]).map(c=>{const o=shuffle(c.o.map((t,i)=>({t,i})));return{type:'crit',q:c.q,opts:o.map(x=>x.t),ans:o.findIndex(x=>x.i===c.a),exp:c.e,level:lv}})}
function bankCount(key,lv){return key==='verb'?VERB[lv].reduce((s,p)=>s+p.s.length,0):CRIT[lv].length}
function build(def,level){
  const n=def.count;
  if(def.key==='num'||def.key==='abs'){
    const out=[],seen=new Set();
    for(let i=0;i<n;i++){const lv=lvAt(i,n,level);let q,t=0;
      do{q=def.key==='num'?pick(NUM[lv])():genAbs(lv);t++}while(def.key==='num'&&seen.has(q.q)&&t<8);
      if(q.q)seen.add(q.q);out.push({...q,type:def.key,level:lv})}
    return out;
  }
  const part=(lv,k)=>def.key==='verb'?verbItems(lv).slice(0,k):critPool(lv,k);
  if(level==='mixed'){const s=split(n);return['easy','medium','hard'].flatMap(lv=>part(lv,s[lv]))}
  return part(level,n);
}

/* ---------- storage ---------- */
const AKEY='cogmock.attempts',HMAX=500;
/* Chi tiết từng bài (đề, đáp án, thời gian) nằm trong IndexedDB vì localStorage chỉ chứa được vài bài.
   ATT là bản sao trong bộ nhớ; ghi xuống IndexedDB chạy nền. Trình duyệt không có IndexedDB thì quay về localStorage. */
let ATT=[],useIDB=false,dbP=null;
function idb(mode,fn){
  dbP=dbP||new Promise((res,rej)=>{const r=indexedDB.open('cogmock',1);r.onupgradeneeded=()=>r.result.createObjectStore('attempts',{keyPath:'id'});r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)});
  return dbP.then(db=>new Promise((res,rej)=>{const t=db.transaction('attempts',mode),q=fn(t.objectStore('attempts'));t.oncomplete=()=>res(q&&q.result);t.onerror=t.onabort=()=>rej(t.error)}));
}
function lsAttempts(){try{return JSON.parse(localStorage.getItem(AKEY))||[]}catch(e){return[]}}
function lsSave(){let l=ATT.slice(0,15);while(l.length){try{localStorage.setItem(AKEY,JSON.stringify(l));break}catch(e){l=l.slice(0,-1)}}}
async function initAttempts(){
  const legacy=lsAttempts();
  try{
    if(!window.indexedDB)throw 0;
    if(legacy.length)await idb('readwrite',st=>{legacy.forEach(a=>st.put(a))});
    ATT=await idb('readonly',st=>st.getAll());useIDB=true;
    if(legacy.length)try{localStorage.removeItem(AKEY)}catch(e){}
  }catch(e){ATT=legacy;useIDB=false}
  ATT.sort((a,b)=>b.t-a.t);
}
function loadAttempts(){return ATT}
function saveAttempt(a){
  ATT=[a,...ATT.filter(x=>x.id!==a.id)].sort((x,y)=>y.t-x.t);
  const drop=ATT.slice(HMAX);ATT=ATT.slice(0,HMAX);
  if(useIDB)idb('readwrite',st=>{st.put(a);drop.forEach(x=>st.delete(x.id))}).catch(()=>{});else lsSave();
}
function deleteAttempt(id){ATT=ATT.filter(x=>x.id!==id);if(useIDB)idb('readwrite',st=>{st.delete(id)}).catch(()=>{});else lsSave()}
function clearAttempts(){ATT=[];if(useIDB)idb('readwrite',st=>{st.clear()}).catch(()=>{});try{localStorage.removeItem(AKEY)}catch(e){}}
/* Lịch sử gọn: chỉ lưu điểm từng phần nên giữ được nhiều lần làm hơn bản chi tiết ở trên. */
const HKEY='cogmock.history';
const summarize=a=>({id:a.id,t:a.t,name:a.name||'',kind:a.kind||'test',early:!!a.early,label:a.label,level:a.level,
  secs:a.sections.map(s=>({key:s.key,c:s.qs.filter((q,i)=>s.answers[i]===q.ans).length,n:s.qs.length,used:s.used,secs:s.secs}))});
function saveHistory(h){try{localStorage.setItem(HKEY,JSON.stringify(h.sort((a,b)=>b.t-a.t).slice(0,HMAX)))}catch(e){}}
function loadHistory(){
  let raw=null;try{raw=localStorage.getItem(HKEY)}catch(e){return[]}
  if(raw!==null){try{return JSON.parse(raw)||[]}catch(e){return[]}}
  const h=loadAttempts().map(summarize);saveHistory(h);return h;
}
function addHistory(e){saveHistory([e,...loadHistory().filter(x=>x.id!==e.id)])}
function removeHistory(id){saveHistory(loadHistory().filter(x=>x.id!==id));deleteAttempt(id)}
function clearHistory(){clearAttempts();try{localStorage.setItem(HKEY,'[]')}catch(e){}}
const hScore=e=>e.secs.reduce((a,s)=>({c:a.c+s.c,n:a.n+s.n}),{c:0,n:0});
const pctOf=(c,n)=>n?Math.round(c/n*100):0;
function cleanEntry(e){
  if(!e||typeof e!=='object'||!Array.isArray(e.secs)||!Number.isFinite(+e.t))return null;
  const secs=e.secs.filter(s=>s&&SECTIONS.some(d=>d.key===s.key)).map(s=>({key:s.key,c:Math.max(0,+s.c|0),n:Math.max(0,+s.n|0),used:+s.used||0,secs:+s.secs||0})).filter(s=>s.n);
  return secs.length?{id:String(e.id||e.t),t:+e.t,kind:e.kind==='review'?'review':'test',early:!!e.early,name:String(e.name||'').slice(0,40),label:String(e.label||'Bài làm'),level:LEVELS[e.level]?e.level:'mixed',secs}:null;
}
const NKEY='cogmock.name';
function getName(){try{return(localStorage.getItem(NKEY)||'').trim()}catch(e){return''}}
function setName(n){try{localStorage.setItem(NKEY,n.trim().slice(0,40))}catch(e){}}

const RKEY='cogmock.run';let lastRunSave=0;

  if(!run)return;lastRunSave=Date.now();

  try{localStorage.setItem(RKEY,JSON.stringify({...run,sel:null,savedAt:Date.now(),sections:run.sections.map(x=>({...x,def:undefined,key:x.def.key}))}))}catch(e){}
}
function loadRun(){
  try{const r=JSON.parse(localStorage.getItem(RKEY));if(!r||!Array.isArray(r.sections))return null;
    r.sections.forEach(x=>x.def=secDef(x.key));return r.sections.every(x=>x.def)?r:null}catch(e){return null}

/* Câu sai: lấy lần gặp gần nhất của mỗi câu trong các bài còn chi tiết; ôn đúng rồi thì câu tự rời khỏi danh sách. */
const qKey=q=>q.type+'|'+(q.type==='abs'?JSON.stringify([q.seq,q.opts]):q.type==='verb'?q.passage+'|'+q.statement:q.q);
function wrongPool(atts){
  const last=new Map();
  [...atts].sort((a,b)=>a.t-b.t).forEach(a=>a.sections.forEach(s=>s.qs.forEach((q,i)=>last.set(qKey(q),{key:s.key,q,ok:s.answers[i]===q.ans}))));
  return[...last.values()].filter(x=>!x.ok);
}
const fmtDate=t=>new Date(t).toLocaleString('vi-VN',{day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'});
const scoreOf=a=>{let c=0,n=0;a.sections.forEach(s=>s.qs.forEach((q,i)=>{n++;if(s.answers[i]===q.ans)c++}));return{c,n}};

let level='mixed',run=null,tick=null;
const mmss=s=>{s=Math.max(0,Math.ceil(s));return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')};

function home(){
  clearInterval(tick);run=null;document.onkeydown=null;
  const hist=loadHistory(),atts=loadAttempts(),detail=new Set(atts.map(a=>a.id)),saved=loadRun(),wrong=wrongPool(atts);
  const total=SECTIONS.reduce((s,d)=>s+d.minutes,0);
  app.innerHTML=`
  <header class="hero">
    <h1>Thi thử Cognitive Test</h1>
    <p class="lead">Bốn phần giống đề tuyển dụng: số học, ngôn ngữ, trừu tượng và tư duy phản biện. Câu hỏi bằng tiếng Anh như đề thật, giải thích đáp án bằng tiếng Việt.</p>
  </header>
  ${saved?(()=>{const s=saved.sections[saved.si],left=saved.phase==='question'?(s.left??0)/1000:s.secs;
    return`<section class="sheet resume" aria-label="Bài đang làm dở"><h3>Bạn có bài đang làm dở</h3>
    <p class="muted">${esc(saved.name)} · ${esc(saved.label)} · lưu lúc ${fmtDate(saved.savedAt)}</p>
    <p style="margin:8px 0 0">${saved.sections.length>1?`Phần ${saved.si+1}/${saved.sections.length}: `:''}${s.def.name}, ${saved.phase==='question'?`đang ở câu ${saved.qi+1}/${s.qs.length}, còn ${mmss(left)}`:'chưa bắt đầu phần này'}. Đồng hồ được dừng trong lúc bạn rời đi.</p>
    <div class="row" style="margin-top:14px"><button class="btn" id="resumeBtn">Làm tiếp</button><button class="btn ghost danger" id="dropBtn">Bỏ bài này</button></div></section>`})():''}
  <section class="sheet">
    <label class="namefield"><span>Tên người làm bài</span>
      <input id="who" maxlength="40" autocomplete="name" placeholder="Ví dụ: Nguyễn Văn An" value="${esc(getName())}" aria-describedby="whoErr">
      <span class="err" id="whoErr" hidden>Nhập tên trước khi bắt đầu để lưu vào lịch sử.</span></label>
    <h3>Mức độ</h3>
    <div class="levels" role="group" aria-label="Mức độ">
      ${Object.entries(LEVELS).map(([k,v])=>`<button data-lv="${k}" aria-pressed="${k===level}">${v}</button>`).join('')}
    </div>
    <p class="muted" style="margin:10px 0 18px;font-size:.95rem" id="lvnote"></p>
    <table class="structure">
      ${SECTIONS.map((d,i)=>`<tr><td class="n">${i+1}</td><td class="name">${d.name}<span class="vi">${d.vi}</span></td><td class="meta">${d.count} câu<br>${d.minutes} phút</td><td class="act"><button class="btn ghost small" data-practice="${d.key}">Luyện riêng</button></td></tr>`).join('')}
    </table>
    <div class="row"><button class="btn" id="startFull">Thi thử đầy đủ (${total} phút)</button><button class="btn ghost" id="study">Xem đề và đáp án</button>${wrong.length?`<button class="btn ghost" id="reviewBtn">Ôn câu sai (${wrong.length})</button>`:''}<button class="btn ghost" id="histBtn">Lịch sử luyện tập${hist.length?` (${hist.length})`:''}</button></div>
  </section>
  <section class="section-gap">
    <h3 style="margin-bottom:8px">Quy định giống đề thật</h3>
    <ul class="notes">
      <li>Mỗi phần có đồng hồ riêng; hết giờ là tự chuyển sang phần tiếp theo.</li>
      <li>Trả lời xong không quay lại câu trước được. Bỏ qua câu nào thì câu đó tính sai.</li>
      <li>Được nghỉ giữa các phần, dùng giấy bút và máy tính cầm tay.</li>
      <li>Phím tắt: 1–4 hoặc A–D để chọn, Enter để trả lời.</li>
    </ul>
  </section>
  ${hist.length?`<section class="section-gap"><div class="row" style="justify-content:space-between"><h3>Lần làm gần đây</h3><button class="btn ghost small" id="allRes">Xem lịch sử (${hist.length})</button></div><table class="hist attempts">${hist.slice(0,5).map(e=>{const sc=hScore(e);return`<tr><td>${fmtDate(e.t)}</td><td>${e.name?`<b>${esc(e.name)}</b> · `:''}${esc(e.label)}<br><span class="muted" style="font-size:.88rem">${LEVELS[e.level]}</span></td><td style="text-align:right"><b>${sc.c}/${sc.n}</b></td><td style="text-align:right;width:1%">${detail.has(e.id)?`<button class="btn ghost small" data-att="${esc(e.id)}">Xem</button>`:''}</td></tr>`}).join('')}</table></section>`:''}
  `;
  const note=()=>{document.getElementById('lvnote').textContent={easy:'Một quy luật, phép tính một bước, đoạn văn ngắn rõ ràng.',medium:'Hai quy luật kết hợp, bảng số liệu, câu hỏi dễ nhầm giữa False và Cannot say.',hard:'Ba quy luật cùng lúc, tính nhiều bước, bẫy logic.',mixed:'Mỗi phần đi từ dễ đến khó, giống cách đề thật thường sắp xếp.'}[level]};
  note();
  app.querySelectorAll('[data-lv]').forEach(b=>b.onclick=()=>{level=b.dataset.lv;app.querySelectorAll('[data-lv]').forEach(x=>x.setAttribute('aria-pressed',x===b));note()});
  app.querySelectorAll('[data-att]').forEach(b=>b.onclick=()=>{const a=loadAttempts().find(x=>x.id===b.dataset.att);if(a)showAttempt(a)});
  const ar=document.getElementById('allRes');if(ar)ar.onclick=historyView;
  document.getElementById('histBtn').onclick=historyView;
  const rv=document.getElementById('reviewBtn');if(rv)rv.onclick=()=>startReview(wrong);
  if(saved){document.getElementById('resumeBtn').onclick=()=>resumeRun(saved);
    document.getElementById('dropBtn').onclick=()=>{if(confirm('Bỏ bài đang làm dở? Kết quả bài này sẽ không được lưu.')){clearRun();home()}}}
  const who=document.getElementById('who');
  who.oninput=()=>{setName(who.value);if(who.value.trim()){who.removeAttribute('aria-invalid');document.getElementById('whoErr').hidden=true}};
  document.getElementById('study').onclick=()=>studyView(level,'num');
  document.getElementById('startFull').onclick=()=>start(SECTIONS.map(d=>({def:d,qs:build(d,level),secs:d.minutes*60})),'Thi thử đầy đủ');
  app.querySelectorAll('[data-practice]').forEach(b=>b.onclick=()=>{const d=SECTIONS.find(x=>x.key===b.dataset.practice);start([{def:d,qs:build(d,level),secs:d.minutes*60}],'Luyện '+d.name)});
}

function askName(){
  const w=document.getElementById('who');if(!w)return;
  w.setAttribute('aria-invalid','true');document.getElementById('whoErr').hidden=false;
  w.scrollIntoView({block:'center'});w.focus();
}
function start(sections,label,opts={}){
  const name=getName();
  if(!name){home();askName();return}
  if(loadRun()&&!confirm('Bạn đang có bài làm dở. Bắt đầu bài mới thì bài đó sẽ bị bỏ. Tiếp tục?'))return;
  run={name,label,level:opts.level||level,kind:opts.kind||'test',phase:'intro',sections:sections.map(s=>({...s,answers:new Array(s.qs.length).fill(null),times:new Array(s.qs.length).fill(null),used:0})),si:0,qi:0,sel:null};
  saveRun();intro();
}
function retryAttempt(att){
  start(att.sections.map(x=>({def:secDef(x.key),qs:x.qs,secs:x.secs})),'Làm lại: '+att.label.replace(/^Làm lại: /,''),{level:att.level,kind:att.kind});
}
function startReview(pool){
  const groups=SECTIONS.map(d=>({def:d,qs:shuffle(pool.filter(x=>x.key===d.key).map(x=>x.q)).slice(0,d.count)})).filter(g=>g.qs.length);
  if(!groups.length)return;
  start(groups.map(g=>({...g,secs:Math.max(60,Math.round(g.def.minutes*60/g.def.count*g.qs.length))})),'Ôn câu sai',{level:'mixed',kind:'review'});
}
function resumeRun(r){
  clearInterval(tick);run=r;
  const s=run.sections[run.si];
  if(run.phase==='question'){
    const left=s.left??Math.max(0,s.endAt-run.savedAt);
    s.endAt=Date.now()+left;s.startAt=s.endAt-s.secs*1000;
    if(left<=0){endSection();return}
    question();tick=setInterval(updTimer,250);
  }else intro();
}
function intro(){
  clearInterval(tick);document.onkeydown=null;
  const s=run.sections[run.si],multi=run.sections.length>1;
  app.innerHTML=`
  <div class="sheet" style="margin-top:20px">
    <p class="muted">${esc(run.name)}${multi?` · Phần ${run.si+1} / ${run.sections.length}`:''}</p>
    <h2>${s.def.name}</h2>
    <p class="muted" style="margin-top:4px">${s.def.vi}</p>
    <p style="font-size:1.1rem;margin:18px 0 6px"><b>${s.qs.length} câu</b> trong <b>${mmss(s.secs)}</b> phút</p>
    <p style="max-width:62ch">${s.def.tip}</p>
    <div class="row" style="margin-top:20px"><button class="btn" id="go">Bắt đầu phần này</button>${run.si===0?`<button class="btn ghost" id="back">Về trang chính</button>`:`<button class="btn ghost danger" id="finish">Nộp bài, bỏ các phần còn lại</button>`}</div>
  </div>`;
  run.phase='intro';saveRun();
  document.getElementById('go').onclick=()=>{s.startAt=Date.now();s.endAt=s.startAt+s.secs*1000;run.qi=0;run.sel=null;run.phase='question';question();saveRun();tick=setInterval(updTimer,250)};
  const b=document.getElementById('back');if(b)b.onclick=()=>{clearRun();home()};
  const f=document.getElementById('finish');if(f)f.onclick=finishEarly;
  document.getElementById('go').focus();
}
function updTimer(){
  const s=run.sections[run.si],left=(s.endAt-Date.now())/1000,el=document.getElementById('timer');
  if(el){el.textContent=mmss(left);el.classList.toggle('low',left<=60)}
  if(left<=0)endSection();
  else if(Date.now()-lastRunSave>3000)saveRun();
}
function qHTML(q){
  if(q.type==='abs')return`
    <p class="qtext">Which figure comes next in the sequence?</p>
    <div class="seq">${q.seq.map(s=>`<div class="panel">${panelSVG(s)}</div>`).join('')}<div class="panel q">?</div></div>
    <div class="aopts" role="radiogroup" aria-label="Answer options">${q.opts.map((s,i)=>`<button class="aopt" role="radio" aria-checked="false" data-i="${i}" aria-label="Option ${'ABCD'[i]}"><span class="k">${'ABCD'[i]}</span><div class="panel">${panelSVG(s)}</div></button>`).join('')}</div>`;
  let h='';
  if(q.type==='verb')h+=`<div class="passage">${esc(q.passage)}</div><p class="stmt">${esc(q.statement)}</p>`;
  else{h+=`<p class="qtext">${esc(q.q)}</p>`;if(q.table)h+=`<div class="tablewrap"><table class="data"><thead><tr>${q.table.head.map(x=>`<th>${esc(x)}</th>`).join('')}</tr></thead><tbody>${q.table.rows.map(r=>`<tr>${r.map(x=>`<td>${esc(x)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`}
  h+=`<div class="opts" role="radiogroup" aria-label="Answer options">${q.opts.map((o,i)=>`<button class="opt" role="radio" aria-checked="false" data-i="${i}"><span class="k">${'ABCD'[i]}</span><span>${esc(o)}</span></button>`).join('')}</div>`;
  return h;
}
function question(){
  const s=run.sections[run.si],q=s.qs[run.qi];run.sel=null;run.qStart=Date.now();
  app.innerHTML=`
  <div class="bar">
    <div><div class="sec">${s.def.name}</div><div class="count">Câu ${run.qi+1} / ${s.qs.length}</div></div>
    <div class="timer" id="timer" aria-label="Thời gian còn lại">${mmss((s.endAt-Date.now())/1000)}</div>
  </div>
  <div class="progress"><i style="width:${run.qi/s.qs.length*100}%"></i></div>
  <div class="qbody">
    <span class="tag">${LEVELS[q.level]}</span>
    ${qHTML(q)}
  </div>
  <div class="foot">
    <div class="row" style="gap:8px"><button class="btn ghost small" id="skip">Bỏ qua</button><button class="btn ghost small" id="pause">Tạm dừng</button><button class="btn ghost small danger" id="finish">Nộp bài</button></div>
    <span class="kbd">1–4 để chọn, Enter để trả lời</span>
    <button class="btn" id="ok" disabled>Trả lời</button>
  </div>`;
  const btns=[...app.querySelectorAll('[role=radio]')];
  const choose=i=>{if(i<0||i>=btns.length)return;run.sel=i;btns.forEach((b,j)=>b.setAttribute('aria-checked',j===i));document.getElementById('ok').disabled=false};
  btns.forEach(b=>b.onclick=()=>choose(+b.dataset.i));
  document.getElementById('ok').onclick=()=>answer(run.sel);
  document.getElementById('skip').onclick=()=>answer(null);
  document.getElementById('pause').onclick=()=>{saveRun();home()};
  document.getElementById('finish').onclick=finishEarly;
  document.onkeydown=e=>{
    if(e.target.tagName==='INPUT')return;
    const k=e.key.toLowerCase();
    if('1234'.includes(k)&&k)choose(+k-1);
    else if('abcd'.includes(k)&&k.length===1)choose('abcd'.indexOf(k));
    else if(e.key==='Enter'&&run.sel!==null){e.preventDefault();answer(run.sel)}
  };
}
function answer(i){
  const s=run.sections[run.si];s.answers[run.qi]=i;s.times[run.qi]=Math.round((Date.now()-run.qStart)/100)/10;
  if(run.qi<s.qs.length-1){run.qi++;question();saveRun()}else endSection();
}
function finishEarly(){
  const left=run.sections.reduce((n,s,k)=>n+(k<run.si?0:s.answers.slice(k===run.si&&run.phase==='question'?run.qi:0).filter(x=>x===null).length),0);
  if(!confirm(`Nộp bài ngay và xem kết quả? ${left} câu chưa làm sẽ tính là sai.`))return;
  clearInterval(tick);document.onkeydown=null;
  const s=run.sections[run.si];if(run.phase==='question')s.used=Math.min(s.secs,(Date.now()-s.startAt)/1000);
  run.early=true;results();
}
function endSection(){
  clearInterval(tick);document.onkeydown=null;
  const s=run.sections[run.si];s.used=Math.min(s.secs,(Date.now()-s.startAt)/1000);
  if(run.si<run.sections.length-1){run.si++;intro()}else results();
}
function results(){
  const a={id:String(Date.now()),t:Date.now(),name:run.name,label:run.label,level:run.level,kind:run.kind||'test',early:!!run.early,
    sections:run.sections.map(s=>({key:s.def.key,secs:s.secs,used:Math.round(s.used),qs:s.qs,answers:s.answers,times:s.times}))};
  clearRun();addHistory(summarize(a));saveAttempt(a);showAttempt(a);
}
const TIPS={
  num:'Đọc câu hỏi trước rồi mới tìm số liệu. % thay đổi luôn chia cho giá trị ban đầu; tăng rồi giảm thì nhân hệ số.',
  verb:'Chỉ dựa vào đoạn văn. Câu có từ tuyệt đối (all, always, only) trong khi đoạn văn chỉ nói chừng mực (some, may) thì thường không phải True.',
  abs:'Kiểm tra từng yếu tố một: xoay, số cạnh, tô màu, số chấm, vị trí. Mỗi quy luật tìm được loại bớt phương án.',
  crit:'Đáp án phải đúng trong mọi trường hợp. Với "nếu P thì Q": thấy Q không suy ra được P, không có P cũng không suy ra được không có Q.'};
const secDef=k=>SECTIONS.find(d=>d.key===k);
const status=(s,i)=>{const a=s.answers[i];return a===null?'skip':a===s.qs[i].ans?'ok':'bad'};
function spark(v){
  const w=220,h=34,p=4,x=i=>v.length<2?w/2:p+i*(w-2*p)/(v.length-1),y=n=>h-p-n/100*(h-2*p);
  return`<svg class="spark" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" aria-hidden="true"><line x1="0" x2="${w}" y1="${y(50)}" y2="${y(50)}"/>${v.length>1?`<polyline points="${v.map((n,i)=>x(i).toFixed(1)+','+y(n).toFixed(1)).join(' ')}"/>`:''}<circle cx="${x(v.length-1).toFixed(1)}" cy="${y(v[v.length-1]).toFixed(1)}" r="3"/></svg>`;
}
function historyView(){
  clearInterval(tick);document.onkeydown=null;run=null;
  const view={sec:'all',lv:'all',who:'all'};
  const render=()=>{
    const all=loadHistory(),detail=new Set(loadAttempts().map(a=>a.id));
    const names=[...new Set(all.map(e=>e.name||''))].sort((a,b)=>a.localeCompare(b,'vi'));
    if(view.who!=='all'&&!names.includes(view.who))view.who='all';
    const byLv=all.filter(e=>(view.lv==='all'||e.level===view.lv)&&(view.who==='all'||(e.name||'')===view.who));
    const rows=byLv.filter(e=>view.sec==='all'||e.secs.some(s=>s.key===view.sec));
    const sc=e=>view.sec==='all'?hScore(e):e.secs.find(s=>s.key===view.sec);
    const tot=rows.reduce((a,e)=>{const s=sc(e);return{c:a.c+s.c,n:a.n+s.n}},{c:0,n:0});
    const best=rows.reduce((m,e)=>{const s=sc(e);return Math.max(m,pctOf(s.c,s.n))},0);
    const days=new Set(rows.map(e=>new Date(e.t).toDateString())).size;
    const trends=SECTIONS.map(d=>{
      const v=byLv.filter(e=>e.kind!=='review'&&e.secs.some(s=>s.key===d.key)).slice(0,20).reverse().map(e=>{const s=e.secs.find(s=>s.key===d.key);return pctOf(s.c,s.n)});
      if(!v.length)return'';
      const last=v[v.length-1],avg=Math.round(v.reduce((a,b)=>a+b,0)/v.length),prev=v.length>1?v[v.length-2]:null,dl=prev===null?0:last-prev;
      return`<div class="trend"><b>${d.name}</b><span class="big">${last}%</span>${spark(v)}<span class="muted">Trung bình ${avg}% · ${v.length} lần gần nhất${prev!==null&&dl?` · <span class="delta ${dl>0?'up':'down'}">${dl>0?'+':''}${dl} điểm so với lần trước</span>`:''}</span></div>`;
    }).join('');
    app.innerHTML=`
    <header class="hero"><h1 style="font-size:clamp(2rem,5vw,2.8rem)">Lịch sử luyện tập</h1>
      <p class="lead">Lưu tối đa ${HMAX} lần làm trên trình duyệt này, kèm đầy đủ đề và đáp án để xem lại hoặc làm lại.${useIDB?'':' Trình duyệt này không hỗ trợ IndexedDB nên chỉ giữ chi tiết 15 lần gần nhất.'}</p></header>
    <div class="controls" style="margin-top:0">
      <div class="chips" role="group" aria-label="Chọn phần"><button data-sec="all" aria-pressed="${view.sec==='all'}">Tất cả phần</button>${SECTIONS.map(d=>`<button data-sec="${d.key}" aria-pressed="${view.sec===d.key}">${d.name}</button>`).join('')}</div>
      ${names.length>1?`<div class="chips" role="group" aria-label="Người làm"><button data-who="all" aria-pressed="${view.who==='all'}">Mọi người</button>${names.map((n,i)=>`<button data-who="${i}" aria-pressed="${view.who===n}">${n?esc(n):'Chưa có tên'}</button>`).join('')}</div>`:''}
      <div class="chips" role="group" aria-label="Mức độ"><button data-hl="all" aria-pressed="${view.lv==='all'}">Mọi mức độ</button>${Object.entries(LEVELS).map(([k,v])=>`<button data-hl="${k}" aria-pressed="${view.lv===k}">${v}</button>`).join('')}</div>
    </div>
    ${rows.length?`
    <section class="sheet" style="margin-top:18px">
      <div class="statgrid" style="margin-top:0">
        <div class="stat"><b>${rows.length}</b><span>Lần làm</span></div>
        <div class="stat"><b>${tot.n}</b><span>Câu đã làm</span></div>
        <div class="stat"><b>${pctOf(tot.c,tot.n)}%</b><span>Tỉ lệ đúng chung</span></div>
        <div class="stat"><b>${best}%</b><span>Cao nhất</span></div>
        <div class="stat"><b>${mmss(rows.reduce((a,e)=>a+(view.sec==='all'?e.secs.reduce((x,s)=>x+s.used,0):sc(e).used),0))}</b><span>Tổng thời gian</span></div>
        <div class="stat"><b>${days}</b><span>Ngày luyện tập</span></div>
      </div>
      ${trends?`<h3 style="margin-top:22px">Tiến bộ theo từng phần</h3><p class="muted" style="font-size:.9rem">Không tính các lần ôn câu sai.</p><div class="trends">${trends}</div>`:''}
    </section>
    <section class="sheet section-gap"><table class="hist attempts">${rows.map(e=>{const s=sc(e);return`<tr>
      <td>${fmtDate(e.t)}</td>
      <td>${e.name?`<b>${esc(e.name)}</b><br>`:''}${esc(e.label)}<br><span class="muted" style="font-size:.88rem">${LEVELS[e.level]}${e.early?' · Nộp sớm':''}</span>${e.secs.length>1?`<br><span class="secmini">${e.secs.map(x=>`${secDef(x.key).name.split(' ')[0]} ${x.c}/${x.n}`).join(' · ')}</span>`:''}</td>
      <td style="text-align:right"><b>${s.c}/${s.n}</b><br><span class="muted" style="font-size:.88rem">${pctOf(s.c,s.n)}%</span></td>
      <td class="acts">${detail.has(e.id)?`<button class="btn ghost small" data-att="${esc(e.id)}">Xem</button><button class="btn ghost small" data-retry="${esc(e.id)}">Làm lại</button>`:''}<button class="btn ghost small danger" data-del="${esc(e.id)}" aria-label="Xóa lần làm ${esc(fmtDate(e.t))}">Xóa</button></td>
    </tr>`}).join('')}</table></section>`
    :`<p class="empty">${all.length?'Không có lần làm nào khớp bộ lọc này.':'Chưa có lần làm nào. Làm một bài thi thử để lịch sử hiện ở đây.'}</p>`}
    <div class="row section-gap">
      <button class="btn" id="homeBtn">Về trang chính</button>
      ${all.length?`<button class="btn ghost" id="exportBtn">Xuất file lịch sử</button>`:''}
      <button class="btn ghost" id="importBtn">Nhập file lịch sử</button>
      ${all.length?`<button class="btn ghost danger" id="clearBtn">Xóa toàn bộ</button>`:''}
      <input type="file" id="importFile" accept="application/json,.json" hidden>
    </div>`;
    app.querySelectorAll('[data-sec]').forEach(b=>b.onclick=()=>{view.sec=b.dataset.sec;render()});
    app.querySelectorAll('[data-hl]').forEach(b=>b.onclick=()=>{view.lv=b.dataset.hl;render()});
    app.querySelectorAll('[data-who]').forEach(b=>b.onclick=()=>{view.who=b.dataset.who==='all'?'all':names[+b.dataset.who];render()});
    app.querySelectorAll('[data-att]').forEach(b=>b.onclick=()=>{const a=loadAttempts().find(x=>x.id===b.dataset.att);if(a)showAttempt(a)});
    app.querySelectorAll('[data-retry]').forEach(b=>b.onclick=()=>{const a=loadAttempts().find(x=>x.id===b.dataset.retry);if(a)retryAttempt(a)});
    app.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>{if(confirm('Xóa lần làm này khỏi lịch sử?')){removeHistory(b.dataset.del);render()}});
    document.getElementById('homeBtn').onclick=home;
    const ex=document.getElementById('exportBtn');if(ex)ex.onclick=()=>{
      const blob=new Blob([JSON.stringify({app:'cogmock',version:1,exportedAt:Date.now(),history:loadHistory(),attempts:loadAttempts()})],{type:'application/json'});
      const u=URL.createObjectURL(blob),l=document.createElement('a');l.href=u;l.download=`lich-su-cognitive-test-${new Date().toISOString().slice(0,10)}.json`;
      document.body.appendChild(l);l.click();l.remove();setTimeout(()=>URL.revokeObjectURL(u),1000);
    };
    const cl=document.getElementById('clearBtn');if(cl)cl.onclick=()=>{if(confirm('Xóa toàn bộ lịch sử và kết quả chi tiết? Thao tác này không hoàn tác được.')){clearHistory();render()}};
    const fi=document.getElementById('importFile');
    document.getElementById('importBtn').onclick=()=>fi.click();
    fi.onchange=()=>{const f=fi.files[0];if(!f)return;f.text().then(txt=>{
      const d=JSON.parse(txt),inH=(Array.isArray(d)?d:d.history||[]).map(cleanEntry).filter(Boolean);
      const inA=Array.isArray(d.attempts)?d.attempts.filter(a=>a&&a.id&&Array.isArray(a.sections)&&a.sections.every(s=>secDef(s.key)&&Array.isArray(s.qs)&&Array.isArray(s.answers)&&Array.isArray(s.times))):[];
      if(!inH.length&&!inA.length)throw new Error('empty');
      const have=new Set(loadHistory().map(e=>e.id)),added=inH.filter(e=>!have.has(e.id)).length;
      saveHistory([...loadHistory().filter(e=>!inH.some(x=>x.id===e.id)),...inH]);
      inA.forEach(a=>saveAttempt({...a,id:String(a.id)}));
      render();alert(`Đã nhập ${added} lần làm mới.`);
    }).catch(()=>alert('File không đúng định dạng lịch sử của trang này.'))};
  };
  render();window.scrollTo(0,0);
}
function showAttempt(att){
  clearInterval(tick);document.onkeydown=null;run=null;
  const view={sec:'all',filter:'all'};
  const sc=scoreOf(att),pct=Math.round(sc.c/sc.n*100);
  const lvStats={easy:[0,0],medium:[0,0],hard:[0,0]};let skipped=0,timedOut=0;
  att.sections.forEach(s=>s.qs.forEach((q,i)=>{lvStats[q.level][1]++;if(s.answers[i]===q.ans)lvStats[q.level][0]++;if(s.answers[i]===null){skipped++;if(s.times[i]===null)timedOut++}}));
  const used=att.sections.reduce((a,s)=>a+s.used,0),total=att.sections.reduce((a,s)=>a+s.secs,0);
  app.innerHTML=`
  <header class="hero">
    <p class="muted">${att.name?`<b>${esc(att.name)}</b> · `:''}${esc(att.label)} · ${LEVELS[att.level]} · ${fmtDate(att.t)}</p>
    <div class="score">${sc.c}<span style="font-size:.45em;color:var(--muted)">/${sc.n}</span></div>
    <p class="lead">Đúng ${pct}% số câu.${timedOut?(att.early?` Nộp bài sớm, ${timedOut} câu chưa làm.`:` ${timedOut} câu chưa kịp làm vì hết giờ.`):att.early?' Nộp bài sớm.':''}</p>
  </header>
  <section class="sheet">
    ${att.sections.map(s=>{const d=secDef(s.key),c=s.qs.filter((q,i)=>s.answers[i]===q.ans).length,tt=s.times.filter(x=>x!==null),avg=tt.length?Math.round(tt.reduce((a,b)=>a+b,0)/tt.length):0;
      return`<div class="secres"><b>${d.name}</b><span style="font-variant-numeric:tabular-nums">${c}/${s.qs.length}</span><div class="meter"><i style="width:${c/s.qs.length*100}%"></i></div><span class="muted" style="font-size:.9rem;grid-column:1/-1">Dùng ${mmss(s.used)} / ${mmss(s.secs)} · trung bình ${avg} giây mỗi câu (gợi ý: ${Math.round(s.secs/s.qs.length)} giây)</span></div>`}).join('')}
    <div class="statgrid">
      ${['easy','medium','hard'].filter(l=>lvStats[l][1]).map(l=>`<div class="stat"><b>${lvStats[l][0]}/${lvStats[l][1]}</b><span>Câu ${LEVELS[l].toLowerCase()}</span></div>`).join('')}
      <div class="stat"><b>${skipped}</b><span>Chưa trả lời</span></div>
      <div class="stat"><b>${mmss(used)}</b><span>Tổng thời gian / ${mmss(total)}</span></div>
    </div>
    <div class="row" style="margin-top:20px">${sc.c<sc.n?`<button class="btn" id="reviewThis">Ôn ${sc.n-sc.c} câu sai của bài này</button>`:''}<button class="btn${sc.c<sc.n?' ghost':''}" id="again">${att.kind==='review'?'Ôn tiếp câu sai':'Làm đề mới cùng cấu trúc'}</button><button class="btn ghost" id="retryBtn">Làm lại đúng đề này</button><button class="btn ghost" id="homeBtn">Về trang chính</button><button class="btn ghost" id="listBtn">Lịch sử</button></div>
  </section>
  <div class="controls">
    <div class="chips" role="group" aria-label="Chọn phần">${att.sections.length>1?`<button data-sec="all" aria-pressed="true">Tất cả phần</button>`:''}${att.sections.map((s,k)=>`<button data-sec="${s.key}" aria-pressed="${att.sections.length===1}">${secDef(s.key).name}</button>`).join('')}</div>
    <div class="chips" role="group" aria-label="Lọc câu">${[['all','Tất cả'],['bad','Sai'],['skip','Chưa trả lời'],['ok','Đúng']].map(([k,v])=>`<button data-f="${k}" aria-pressed="${k==='all'}">${v}</button>`).join('')}</div>
  </div>
  <div id="list"></div>`;
  if(att.sections.length===1)view.sec=att.sections[0].key;
  const opt=(q,a,j,inner)=>`<li class="${j===q.ans?'is-ans':''} ${j===a&&j!==q.ans?'is-wrong':''}"><span class="k">${'ABCD'[j]}</span>${inner}${j===q.ans?'<em>Đáp án đúng</em>':j===a?'<em>Bạn chọn</em>':''}</li>`;
  const card=(s,i)=>{
    const q=s.qs[i],a=s.answers[i],st=status(s,i),t=s.times[i];
    const resTxt=st==='ok'?'Đúng':st==='bad'?'Sai':(t===null?(att.early?'Chưa làm':'Hết giờ, chưa làm'):'Bỏ qua');
    let body='';
    if(q.type==='abs')body=`<p style="margin-bottom:8px"><b>Which figure comes next?</b></p><div class="mini"><div class="seq">${q.seq.map(x=>`<div class="panel">${panelSVG(x)}</div>`).join('')}<div class="panel q">?</div></div></div>
      <ul class="ro abs">${q.opts.map((o,j)=>opt(q,a,j,`<div class="panel">${panelSVG(o)}</div>`)).join('')}</ul>`;
    else{
      if(q.type==='verb')body=`<div class="mini"><div class="passage">${esc(q.passage)}</div></div><p style="margin:0"><b>${esc(q.statement)}</b></p>`;
      else body=`<p style="margin:0"><b>${esc(q.q)}</b></p>`+(q.table?`<div class="tablewrap" style="margin-top:10px"><table class="data"><thead><tr>${q.table.head.map(x=>`<th>${esc(x)}</th>`).join('')}</tr></thead><tbody>${q.table.rows.map(r=>`<tr>${r.map(x=>`<td>${esc(x)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`:'');
      body+=`<ul class="ro">${q.opts.map((o,j)=>opt(q,a,j,`<span>${esc(o)}</span>`)).join('')}</ul>`;
    }
    return`<article class="qcard st-${st}" id="q-${s.key}-${i}">
      <div class="qhead"><span>${secDef(s.key).name} · Câu ${i+1} · ${LEVELS[q.level]}${t!==null?` · ${t} giây`:''}</span><span class="res ${st}">${resTxt}</span></div>
      ${body}
      <div class="why"><p><b>Giải thích:</b> ${esc(q.exp)}</p>${st!=='ok'?`<p class="tip">Mẹo: ${TIPS[s.key]}</p>`:''}</div>
    </article>`;
  };
  const draw=()=>{
    const secs=att.sections.filter(s=>view.sec==='all'||s.key===view.sec);
    let html='',count=0;
    for(const s of secs){
      const idx=s.qs.map((_,i)=>i).filter(i=>view.filter==='all'||status(s,i)===view.filter);
      html+=`<h3 style="margin-top:22px">${secDef(s.key).name}</h3>
        <div class="navgrid" aria-label="Danh sách câu">${s.qs.map((_,i)=>`<button class="st-${status(s,i)}" data-go="q-${s.key}-${i}" aria-label="Câu ${i+1}">${i+1}</button>`).join('')}</div>`;
      html+=idx.length?idx.map(i=>card(s,i)).join(''):`<p class="empty">Không có câu nào khớp bộ lọc này.</p>`;
      count+=idx.length;
    }
    const list=document.getElementById('list');list.innerHTML=html;
    list.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>{let el=document.getElementById(b.dataset.go);
      if(!el){view.filter='all';app.querySelectorAll('[data-f]').forEach(x=>x.setAttribute('aria-pressed',x.dataset.f==='all'));draw();el=document.getElementById(b.dataset.go)}
      el.scrollIntoView({behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth'})});
  };
  app.querySelectorAll('[data-sec]').forEach(b=>b.onclick=()=>{view.sec=b.dataset.sec;app.querySelectorAll('[data-sec]').forEach(x=>x.setAttribute('aria-pressed',x===b));draw()});
  app.querySelectorAll('[data-f]').forEach(b=>b.onclick=()=>{view.filter=b.dataset.f;app.querySelectorAll('[data-f]').forEach(x=>x.setAttribute('aria-pressed',x===b));draw()});
  draw();
  document.getElementById('retryBtn').onclick=()=>retryAttempt(att);
  const rt=document.getElementById('reviewThis');if(rt)rt.onclick=()=>startReview(wrongPool([att]));
  document.getElementById('again').onclick=()=>{if(att.kind==='review'){const w=wrongPool(loadAttempts());if(w.length)startReview(w);else{alert('Không còn câu sai nào để ôn.');home()}return}level=att.level;start(SECTIONS.filter(d=>att.sections.some(s=>s.key===d.key)).map(d=>({def:d,qs:build(d,att.level),secs:d.minutes*60})),att.label)};
  document.getElementById('homeBtn').onclick=home;
  document.getElementById('listBtn').onclick=historyView;
  window.scrollTo(0,0);
}
function studyView(lv,secKey){
  clearInterval(tick);document.onkeydown=null;run=null;level=lv;
  const d=secDef(secKey),qs=build(d,lv);
  app.innerHTML=`
  <header class="hero" style="padding-bottom:10px">
    <h1 style="font-size:clamp(2rem,5vw,2.8rem)">Xem đề và đáp án</h1>
    <p class="lead">Đọc nhanh đề, đáp án đúng và giải thích, không tính giờ và không chấm điểm. Bấm "Đề khác" để xem bộ câu mới.</p>
  </header>
  <div class="controls" style="margin-top:6px">
    <div class="chips" role="group" aria-label="Chọn phần">${SECTIONS.map(s=>`<button data-sec="${s.key}" aria-pressed="${s.key===secKey}">${s.name}</button>`).join('')}</div>
    <div class="chips" role="group" aria-label="Mức độ">${Object.entries(LEVELS).map(([k,v])=>`<button data-lv="${k}" aria-pressed="${k===lv}">${v}</button>`).join('')}</div>
  </div>
  <p class="muted" style="margin:14px 0 0">${d.name}: ${d.count} câu, ${d.minutes} phút khi thi thật. ${TIPS[secKey]}</p>
  <div id="list">${qs.map((q,i)=>{
    const ans=j=>j===q.ans?' class="is-ans"':'',em=j=>j===q.ans?'<em>Đáp án đúng</em>':'';
    let body;
    if(q.type==='abs')body=`<div class="mini"><div class="seq">${q.seq.map(x=>`<div class="panel">${panelSVG(x)}</div>`).join('')}<div class="panel q">?</div></div></div><ul class="ro abs">${q.opts.map((o,j)=>`<li${ans(j)}><span class="k">${'ABCD'[j]}</span><div class="panel">${panelSVG(o)}</div>${em(j)}</li>`).join('')}</ul>`;
    else{
      body=q.type==='verb'?`<div class="mini"><div class="passage">${esc(q.passage)}</div></div><p style="margin:0"><b>${esc(q.statement)}</b></p>`:`<p style="margin:0"><b>${esc(q.q)}</b></p>`+(q.table?`<div class="tablewrap" style="margin-top:10px"><table class="data"><thead><tr>${q.table.head.map(x=>`<th>${esc(x)}</th>`).join('')}</tr></thead><tbody>${q.table.rows.map(r=>`<tr>${r.map(x=>`<td>${esc(x)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`:'');
      body+=`<ul class="ro">${q.opts.map((o,j)=>`<li${ans(j)}><span class="k">${'ABCD'[j]}</span><span>${esc(o)}</span>${em(j)}</li>`).join('')}</ul>`;
    }
    return`<article class="qcard st-ok"><div class="qhead"><span>Câu ${i+1} · ${LEVELS[q.level]}</span><span class="res ok">Đáp án: ${'ABCD'[q.ans]}</span></div>${body}<div class="why"><p><b>Giải thích:</b> ${esc(q.exp)}</p></div></article>`;
  }).join('')}</div>
  <div class="row section-gap"><button class="btn" id="more">Đề khác</button><button class="btn ghost" id="try">Làm thử phần này</button><button class="btn ghost" id="homeBtn">Về trang chính</button></div>`;
  app.querySelectorAll('[data-sec]').forEach(b=>b.onclick=()=>studyView(lv,b.dataset.sec));
  app.querySelectorAll('[data-lv]').forEach(b=>b.onclick=()=>studyView(b.dataset.lv,secKey));
  document.getElementById('more').onclick=()=>studyView(lv,secKey);
  document.getElementById('try').onclick=()=>start([{def:d,qs:build(d,lv),secs:d.minutes*60}],'Luyện '+d.name);
  document.getElementById('homeBtn').onclick=home;
  window.scrollTo(0,0);
}
initAttempts().finally(home);
</script>
</body>
</html>
