  {t:'Từ tuyệt đối: all, always, only, never',
   how:`Khi câu dùng từ tuyệt đối mà đoạn văn chỉ nói chừng mực (some, often, occasionally, may), câu đó thường là <b>False</b> nếu đoạn văn có ngoại lệ, hoặc <b>Cannot say</b> nếu đoạn văn không nói gì thêm.`,
   ex:`<div class="passage">Some large structures, such as highways, can occasionally be seen from orbit.</div><p><b>Statement:</b> Highways are always visible from orbit.</p>`,
   sol:[`"occasionally" (thỉnh thoảng) mâu thuẫn với "always" (luôn luôn).`,`Đáp án <b>False</b>.`]},
  {t:'Kiến thức bên ngoài → Cannot say',
   how:`Dù bạn biết điều đó đúng ngoài đời, đoạn văn không nói thì vẫn là Cannot say.`,
   ex:`<div class="passage">Vietnam is one of the world's largest coffee exporters.</div><p><b>Statement:</b> Vietnam exports more coffee than Brazil.</p>`,
   sol:[`Đoạn văn chỉ nói "một trong những nước lớn nhất", không so sánh với Brazil.`,`Đáp án <b>Cannot say</b>.`],
   trap:`Chọn True hoặc False dựa vào hiểu biết của bản thân.`},
  {t:'Tương quan không phải nhân quả → Cannot say',
   how:`Hai thứ đi cùng nhau không chứng minh cái này gây ra cái kia, nhất là khi đoạn văn nêu yếu tố khác có thể là nguyên nhân.`,
   ex:`<div class="passage">Adults who drank two or more cups of coffee a day had a 12% lower rate of heart disease. The study was observational, and coffee drinkers were also more physically active.</div><p><b>Statement:</b> Drinking coffee reduces the risk of heart disease.</p>`,
   sol:[`Nghiên cứu chỉ thấy mối liên hệ. Có thể nguyên nhân thật là vận động nhiều.`,`Đáp án <b>Cannot say</b>.`]},
  {t:'Điều kiện và ngoại lệ',
   how:`Với các quy định kiểu "chỉ khi…", "trừ khi…", hãy kiểm tra từng điều kiện một, giống như đang làm thủ tục.`,
   ex:`<div class="passage">Employees may book business class only for journeys longer than six hours. Flights must be booked 14 days in advance unless a director approves an exception.</div><p><b>Statement:</b> An employee may book business class for a five-hour journey if a director approves.</p>`,
   sol:[`Ngoại lệ của giám đốc chỉ áp dụng cho thời hạn đặt vé, không áp dụng cho điều kiện 6 tiếng.`,`Chuyến 5 tiếng không đủ điều kiện hạng thương gia.`,`Đáp án <b>False</b>.`]},
 ]},
{key:'abs',name:'Abstract Reasoning',vi:'Suy luận trừu tượng',
 intro:`Bạn thấy một dãy 4 hình và phải chọn hình tiếp theo. Mỗi dãy được tạo từ 1 đến 3 <b>quy luật</b> chạy cùng lúc. Với 50 câu trong 10 phút, bạn chỉ có khoảng <b>12 giây mỗi câu</b>, nên cần một cách kiểm tra cố định thay vì nhìn ngẫu hứng.`,
 steps:[`<b>Nhìn 4 phương án trước.</b> Các phương án khác nhau ở yếu tố nào thì chỉ cần kiểm tra yếu tố đó.`,
  `Kiểm tra theo thứ tự cố định: <b>số lượng</b> (cạnh, chấm) → <b>xoay</b> → <b>vị trí</b> → <b>màu</b> → <b>kích thước</b> → <b>kiểu nét</b> (liền hay đứt).`,
  `Tìm được một quy luật thì <b>loại ngay</b> các phương án sai quy luật đó, rồi mới tìm quy luật tiếp theo.`,
  `Quá 20 giây chưa ra thì chọn phương án còn lại hợp lý nhất và đi tiếp.`],
 types:[
  {t:'Xoay',how:`Hình xoay một góc cố định mỗi bước, thường là 45° hoặc 90°. Theo dõi một điểm dễ thấy, như đầu mũi tên.`,
   abs:{seq:[0,90,180,270].map(r=>ab('arrow',{rot:r})),opts:[ab('arrow',{rot:90}),ab('arrow',{rot:0}),ab('arrow',{rot:180}),ab('arrow',{rot:45})],ans:1},
   sol:[`Mũi tên quay 90° theo chiều kim đồng hồ mỗi bước: lên → phải → xuống → trái.`,`Bước tiếp theo quay về hướng lên, đáp án <b>B</b>.`]},
  {t:'Số cạnh tăng hoặc giảm',how:`Đếm số cạnh: tam giác 3, vuông 4, ngũ giác 5…`,
   abs:{seq:[3,4,5,6].map(n=>ab('poly',{sides:n})),opts:[ab('poly',{sides:6}),ab('poly',{sides:8}),ab('poly',{sides:7}),ab('poly',{sides:5})],ans:2},
   sol:[`3 → 4 → 5 → 6 cạnh, mỗi bước thêm 1.`,`Tiếp theo là 7 cạnh, đáp án <b>C</b>.`]},
  {t:'Tô màu xen kẽ',how:`Hình đổi giữa tô đặc và để rỗng theo chu kỳ 2 (đặc, rỗng, đặc…) hoặc chu kỳ 3.`,
   abs:{seq:[true,false,true,false].map(f=>ab('poly',{sides:5,fill:f})),opts:[ab('poly',{sides:5,fill:true}),ab('poly',{sides:5}),ab('poly',{sides:6,fill:true}),ab('poly',{sides:4,fill:true})],ans:0},
   sol:[`Đặc → rỗng → đặc → rỗng.`,`Tiếp theo là đặc, và hình vẫn là ngũ giác, đáp án <b>A</b>.`],
   trap:`Phương án C và D cũng tô đặc nhưng đổi số cạnh, trong khi dãy không thay đổi số cạnh.`},
  {t:'Số chấm',how:`Đếm số chấm nhỏ dưới hình. Số chấm thường tăng hoặc giảm 1 mỗi bước.`,
   abs:{seq:[1,2,3,4].map(d=>ab('poly',{sides:3,dots:d})),opts:[ab('poly',{sides:3,dots:4}),ab('poly',{sides:3,dots:6}),ab('poly',{sides:4,dots:5}),ab('poly',{sides:3,dots:5})],ans:3},
   sol:[`1 → 2 → 3 → 4 chấm.`,`Tiếp theo là 5 chấm, hình vẫn là tam giác, đáp án <b>D</b>.`]},
  {t:'Vị trí di chuyển',how:`Một chi tiết nhỏ (ô vuông ở góc) đi vòng quanh khung: từng góc một, hoặc nhảy sang góc đối diện.`,
   abs:{seq:[0,1,2,3].map(c=>ab('poly',{sides:4,corner:c})),opts:[ab('poly',{sides:4,corner:2}),ab('poly',{sides:4,corner:0}),ab('poly',{sides:4,corner:3}),ab('poly',{sides:4,corner:1})],ans:1},
   sol:[`Ô vuông đi theo chiều kim đồng hồ: trên trái → trên phải → dưới phải → dưới trái.`,`Bước tiếp theo về lại trên trái, đáp án <b>B</b>.`]},
  {t:'Hai chuỗi xen kẽ',how:`Hình ở vị trí lẻ và vị trí chẵn thuộc hai chuỗi khác nhau, mỗi chuỗi có quy luật riêng. Dấu hiệu: các hình "nhảy" qua lại giữa hai kiểu hoàn toàn khác nhau.`,
   abs:{seq:[ab('arrow',{rot:0}),ab('poly',{sides:3}),ab('arrow',{rot:90}),ab('poly',{sides:4})],opts:[ab('poly',{sides:5}),ab('arrow',{rot:180}),ab('arrow',{rot:90}),ab('arrow',{rot:270})],ans:1},
   sol:[`Chuỗi 1 (hình 1, 3, 5): mũi tên quay 90° theo chiều kim đồng hồ, lên → phải → xuống.`,`Chuỗi 2 (hình 2, 4): đa giác thêm 1 cạnh.`,`Hình thứ 5 thuộc chuỗi 1, đáp án <b>B</b>.`],
   trap:`Chọn ngũ giác (A) vì nối tiếp chuỗi đa giác. Hình thứ 5 là vị trí lẻ nên phải thuộc chuỗi mũi tên.`},
  {t:'Ma trận 3×3',how:`Đọc theo <b>hàng</b> rồi theo <b>cột</b>. Thường mỗi hướng có một quy luật riêng. Ở bài khó, mỗi giá trị xuất hiện đúng một lần trên mỗi hàng và mỗi cột, giống Sudoku.`,
   abs:{form:'matrix',grid:[0,1,2].flatMap(r=>[0,1,2].map(c=>ab('poly',{sides:3+r,dots:c}))).slice(0,8),opts:[ab('poly',{sides:5,dots:1}),ab('poly',{sides:5,dots:2}),ab('poly',{sides:4,dots:2}),ab('poly',{sides:5,dots:2,fill:true})],ans:1},
   sol:[`Theo hàng: hàng 1 là tam giác, hàng 2 là hình vuông, hàng 3 là ngũ giác.`,`Theo cột: cột 1 không chấm, cột 2 một chấm, cột 3 hai chấm.`,`Ô còn thiếu là ngũ giác có 2 chấm, đáp án <b>B</b>.`]},
  {t:'Chồng hình',how:`Hình thứ ba của mỗi hàng là hai hình đầu đặt chồng lên nhau. Có hai kiểu: <b>gộp tất cả nét</b>, hoặc <b>nét trùng thì mất</b> (chỉ giữ nét có ở đúng một hình). Xem hai hàng đầu để biết là kiểu nào.`,
   abs:{form:'matrix',grid:[9,3,10,144,192,80,33,36].map(m=>ab('lines',{mask:m})),opts:[ab('lines',{mask:5}),ab('lines',{mask:37}),ab('lines',{mask:32}),ab('lines',{mask:13})],ans:0},
   sol:[`Hàng 1: cạnh trái + cạnh trên, chồng với cạnh trên + cạnh phải. Cạnh trên trùng nên mất, còn cạnh trái và cạnh phải. Đây là kiểu "nét trùng thì mất".`,`Hàng 3: cạnh trên + đường chéo /, chồng với đường chéo / + cạnh dưới. Đường chéo trùng nên mất.`,`Còn lại cạnh trên và cạnh dưới, đáp án <b>A</b>.`],
   trap:`Phương án B gộp hết các nét, giữ cả đường chéo. Đó là kiểu chồng hình còn lại, không đúng với đề này.`},
  {t:'Tìm hình khác loại (odd one out)',how:`Không có dãy, chỉ có 4 hình. Ba hình có chung một đặc điểm, hình còn lại thì không. Yếu tố nào được chia đều hai–hai (2 hình đặc, 2 hình rỗng) thường chỉ là yếu tố gây nhiễu.`,
   abs:{form:'odd',seq:[],opts:[ab('poly',{sides:4,fill:true,dots:1}),ab('poly',{sides:4,dots:2}),ab('poly',{sides:5,fill:true,dots:2}),ab('poly',{sides:4,dots:1})],ans:2},
   sol:[`Màu: 2 đặc, 2 rỗng. Số chấm: 2 hình 1 chấm, 2 hình 2 chấm. Hai yếu tố này chia đều nên không phải khác biệt.`,`Số cạnh: ba hình vuông và một ngũ giác.`,`Đáp án <b>C</b>.`]},
  {t:'Kết hợp hai quy luật',how:`Câu khó thường ghép 2–3 quy luật đơn giản. Tìm từng quy luật một rồi loại dần.`,
   abs:{seq:[0,1,2,3].map(i=>ab('arrow',{rot:i*90,fill:i%2===0})),opts:[ab('arrow',{rot:0,fill:false}),ab('arrow',{rot:90,fill:true}),ab('arrow',{rot:0,fill:true}),ab('arrow',{rot:270,fill:true})],ans:2},
   sol:[`Quy luật 1: xoay 90° mỗi bước, nên tiếp theo mũi tên chỉ lên. Loại B và D.`,`Quy luật 2: xen kẽ đặc và rỗng (đặc, rỗng, đặc, rỗng), nên tiếp theo là đặc. Loại A.`,`Đáp án <b>C</b>.`],
   trap:`Mỗi phương án sai thường đúng một quy luật và sai quy luật còn lại. Đừng chọn ngay khi mới kiểm tra xong một quy luật.`},
 ]},
{key:'crit',name:'Critical Thinking',vi:'Tư duy phản biện',
 intro:`Phần này dựa trên 5 kỹ năng của bài Watson-Glaser: <b>suy diễn</b>, <b>nhận ra giả định</b>, <b>suy luận</b>, <b>diễn giải</b> và <b>đánh giá lập luận</b>. Đáp án đúng là đáp án <b>chắc chắn đúng</b> theo dữ kiện, không phải đáp án nghe có lý nhất.`,
 steps:[`Chỉ dùng dữ kiện trong đề, giống phần Verbal.`,
  `Với câu "must be true", thử tìm <b>một trường hợp phản ví dụ</b>. Có phản ví dụ thì phương án đó sai.`,
  `Vẽ nhanh ra giấy: hình tròn cho "all/some/no", đường thẳng cho câu xếp thứ tự.`,
  `Cẩn thận với những phương án "nghe hợp lý" nhưng thêm thông tin đề không có.`],
 types:[
  {t:'Tam đoạn luận (All / Some / No)',
   how:`Vẽ hai vòng tròn. "All A are B" là vòng A nằm trong vòng B. "Some A are B" là hai vòng giao nhau. "No A are B" là hai vòng tách rời.`,
   ex:`<p><b>Some engineers are designers. All designers use Figma. Which must be true?</b></p><p class="muted">A. All engineers use Figma · B. Some engineers use Figma · C. All Figma users are designers · D. No engineer uses Figma</p>`,
   sol:[`Những kỹ sư là designer nằm trong vòng designer, mà vòng designer nằm trọn trong vòng "dùng Figma".`,`Vậy ít nhất <b>một số</b> kỹ sư dùng Figma, đáp án <b>B</b>.`],
   trap:`A sai vì không biết các kỹ sư không phải designer có dùng Figma hay không. C đảo ngược chiều của "All".`},
  {t:'Nếu… thì…',
   how:`Với "Nếu P thì Q", chỉ có 2 cách suy luận đúng. <b>Có P → có Q</b>. <b>Không có Q → không có P</b>. Hai cách còn lại sai: có Q không suy ra có P, không có P không suy ra không có Q.`,
   ex:`<p><b>If a candidate passes the test, they get an interview. Nam got an interview. What follows?</b></p><p class="muted">A. Nam passed the test · B. Nam did not pass · C. It cannot be determined whether Nam passed</p>`,
   sol:[`Có Q (được phỏng vấn) không suy ra P (đã qua test). Có thể Nam được phỏng vấn theo cách khác, ví dụ được giới thiệu.`,`Đáp án <b>C</b>.`],
   trap:`Chọn A. Đây là lỗi "khẳng định hệ quả", bẫy kinh điển của dạng này.`},
  {t:'Nhận ra giả định ngầm',
   how:`Giả định là điều người nói <b>ngầm coi là đúng</b> mà không nói ra. Mẹo <b>phủ định</b>: đảo ngược phương án lại. Nếu đảo xong mà lập luận sụp đổ, đó chính là giả định.`,
   ex:`<p><b>"We should open on Sundays because more customers will come." Which assumption does this rely on?</b></p><p class="muted">A. Rent is cheaper on Sundays · B. Customers are willing to shop on Sundays · C. Competitors are closed on Sundays</p>`,
   sol:[`Phủ định B: "Khách không muốn mua sắm Chủ nhật". Khi đó lập luận "sẽ có thêm khách" sụp đổ.`,`Phủ định A hay C, lập luận vẫn đứng được.`,`Đáp án <b>B</b>.`]},
  {t:'Suy luận: đúng, có thể đúng hay thiếu dữ liệu',
   how:`Trong đề Watson-Glaser, phần Inference có 5 mức: True, Probably true, Insufficient data, Probably false, False. Chỉ chọn <b>True</b> khi dữ kiện bắt buộc điều đó. Nếu chỉ "rất có thể" thì là <b>Probably true</b>.`,
   ex:`<div class="passage">200 students volunteered for a weekend workshop on climate policy. Most came from economics and law faculties.</div><p><b>Inference:</b> The students were interested in climate policy.</p>`,
   sol:[`Tự nguyện đi học cuối tuần cho thấy họ rất có thể quan tâm, nhưng không chắc chắn (có thể đi vì được cộng điểm).`,`Đáp án <b>Probably true</b>.`]},
  {t:'Diễn giải: kết luận có vượt quá dữ kiện không',
   how:`Kết luận được chấp nhận khi nó theo sau dữ kiện "vượt qua mọi nghi ngờ hợp lý". Kết luận <b>mở rộng</b> ra nhóm khác, thời gian khác hoặc nguyên nhân khác thì không theo sau.`,
   ex:`<p><b>A trial of 300 adults, none over 65, found the drug reduced migraines by 40%. Conclusion: the drug works for patients over 65.</b></p>`,
   sol:[`Dữ kiện không có ai trên 65 tuổi, nên kết luận về nhóm này vượt quá dữ kiện.`,`Kết luận <b>không theo sau</b>.`]},
  {t:'Đánh giá lập luận mạnh hay yếu',
   how:`Lập luận <b>mạnh</b> khi vừa <b>quan trọng</b> vừa <b>liên quan trực tiếp</b> tới câu hỏi. Lập luận <b>yếu</b> khi chung chung, cảm tính, hoặc chỉ nói "người khác cũng làm".`,
   ex:`<p><b>Should the company offer free English classes? Which is the strongest argument for "Yes"?</b></p><p class="muted">A. Classes would be fun · B. Other companies offer them · C. Many clients are international and staff need English to work with them</p>`,
   sol:[`A là cảm tính, B là "người khác cũng làm".`,`C gắn trực tiếp với hiệu quả công việc, đáp án <b>C</b>.`]},
  {t:'Làm yếu hoặc củng cố lập luận',
   how:`Muốn làm yếu một kết luận nhân quả, tìm <b>nguyên nhân khác</b> hoặc chỉ ra hiện tượng <b>đã có từ trước</b>. Muốn củng cố, tìm <b>nhóm đối chứng</b> không có nguyên nhân đó và không có kết quả đó.`,
   ex:`<p><b>Town A residents live longer than Town B residents. A council member says Town A's new hospital is the reason. Which most weakens this?</b></p><p class="muted">A. The hospital employs 500 staff · B. Town A residents already lived longer before the hospital was built · C. Town B plans a hospital</p>`,
   sol:[`Nếu trước khi có bệnh viện người dân đã sống thọ hơn, thì bệnh viện không phải nguyên nhân.`,`Đáp án <b>B</b>.`]},
  {t:'Xếp thứ tự',
   how:`Vẽ một đường thẳng và đặt từng người lên theo từng dữ kiện. Bắt đầu từ dữ kiện có nhiều thông tin nhất.`,
   ex:`<p><b>Lan finished before Minh but after Quân. Tú finished after Minh. Who finished second?</b></p>`,
   sol:[`"Lan sau Quân, trước Minh": Quân → Lan → Minh.`,`"Tú sau Minh": Quân → Lan → Minh → Tú.`,`Người thứ hai là <b>Lan</b>.`]},
  {t:'Các lỗi lập luận hay gặp',
   how:`<b>Thiên kiến kẻ sống sót</b>: chỉ nhìn người thành công. <b>Khái quát vội</b>: vài ví dụ suy ra tất cả. <b>Nhầm tương quan với nhân quả</b>. <b>Ngụy biện "ai cũng làm"</b>.`,
   ex:`<p><b>"Every successful founder I know dropped out of university, so dropping out increases your chance of success." What is the main flaw?</b></p>`,
   sol:[`Lập luận chỉ nhìn những người bỏ học <b>và thành công</b>, bỏ qua rất nhiều người bỏ học nhưng không thành công.`,`Đây là <b>thiên kiến kẻ sống sót</b>.`]},
 ]},
];

 ['JobTestPrep: True / False / Cannot Say','https://www.jobtestprep.co.uk/true-false-cannot-say'],

function guideView(focus){
  clearInterval(tick);document.onkeydown=null;run=null;
  const absEx=x=>`<p><b>${ABS_TEXT[x.form]||'Which figure comes next?'}</b></p><div class="mini">${absStem(x)}</div>
    <ul class="ro abs">${x.opts.map((o,j)=>`<li${j===x.ans?' class="is-ans"':''}><span class="k">${'ABCD'[j]}</span><div class="panel">${panelSVG(o)}</div>${j===x.ans?'<em>Đáp án đúng</em>':''}</li>`).join('')}</ul>`;
  const typeHTML=(t,i,g)=>`<article class="gtype" id="g-${g.key}-${i}">
    <h4><span class="gnum">${i+1}</span>${t.t}</h4>
    <p>${t.how}</p>
    <div class="gex"><span class="glabel">Ví dụ</span>${t.abs?absEx(t.abs):t.ex}</div>
    <div class="gsol"><span class="glabel">Cách giải</span><ol>${t.sol.map(x=>`<li>${x}</li>`).join('')}</ol></div>
    ${t.trap?`<p class="gtrap"><b>Bẫy hay gặp:</b> ${t.trap}</p>`:''}
  </article>`;
  app.innerHTML=`
  <header class="hero" style="padding-bottom:10px">
    <h1 style="font-size:clamp(2rem,5vw,2.8rem)">Mẹo làm bài</h1>
    <p class="lead">Cách nhận ra từng dạng câu hỏi và cách giải nhanh, mỗi dạng có một ví dụ cụ thể. Đề ví dụ bằng tiếng Anh giống đề thật.</p>
  </header>
  <div class="controls" style="margin-top:6px"><div class="chips" role="group" aria-label="Chuyển tới phần">${GUIDE.map(g=>`<button data-gto="${g.key}">${g.name}</button>`).join('')}</div></div>
  ${GUIDE.map(g=>`<section class="gsec" id="g-${g.key}">
    <h2>${g.name}</h2><p class="muted" style="margin-top:2px">${g.vi}</p>
    <p class="gintro">${g.intro}</p>
    <div class="sheet"><h3>${g.key==='all'?'Nguyên tắc':'Cách làm chung'}</h3><ol class="gsteps">${g.steps.map(x=>`<li>${x}</li>`).join('')}</ol></div>
    ${g.types.length?`<h3 style="margin-top:22px">Các dạng thường gặp</h3><ul class="gtoc">${g.types.map((t,i)=>`<li><a href="#g-${g.key}-${i}" data-gjump="g-${g.key}-${i}">${t.t}</a></li>`).join('')}</ul>${g.types.map((t,i)=>typeHTML(t,i,g)).join('')}`:''}
    ${g.key==='abs'?`<p style="margin-top:14px"><a href="meo-abstract-reasoning.pdf" target="_blank" rel="noopener">Tải tài liệu PDF mẹo Abstract Reasoning</a></p>`:''}
    ${g.key!=='all'?`<div class="row" style="margin-top:16px"><button class="btn small" data-gpractice="${g.key}">Luyện riêng ${g.name}</button><button class="btn ghost small" data-gstudy="${g.key}">Xem đề và đáp án</button></div>`:''}
  </section>`).join('')}
  <section class="gsec"><h3>Nguồn tham khảo</h3><ul class="notes">${GUIDE_SRC.map(([t,u])=>`<li><a href="${u}" target="_blank" rel="noopener">${t}</a></li>`).join('')}</ul></section>
  <div class="row section-gap"><button class="btn" id="homeBtn">Về trang chính</button></div>`;
  const go=id=>{const el=document.getElementById(id);if(el)el.scrollIntoView({behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth'})};
  app.querySelectorAll('[data-gto]').forEach(b=>b.onclick=()=>go('g-'+b.dataset.gto));
  app.querySelectorAll('[data-gjump]').forEach(a=>a.onclick=e=>{e.preventDefault();go(a.dataset.gjump)});
  app.querySelectorAll('[data-gpractice]').forEach(b=>b.onclick=()=>{const d=secDef(b.dataset.gpractice);start([{def:d,qs:build(d,level),secs:d.minutes*60}],'Luyện '+d.name)});
  app.querySelectorAll('[data-gstudy]').forEach(b=>b.onclick=()=>studyView(level,b.dataset.gstudy));
  document.getElementById('homeBtn').onclick=home;
  if(focus)requestAnimationFrame(()=>go('g-'+focus));else window.scrollTo(0,0);
}
/* ---------- xem đề và đáp án theo dạng ---------- */
// Tên dạng của các hàm sinh câu Numerical, theo đúng thứ tự trong NUM sau khi đã ghép NUM_NEW.
const NUM_NAMES={
  easy:['Phần trăm của một số','Dãy số cộng','Tỷ lệ thuận theo đơn giá','Giảm giá theo phần trăm','Phần trăm của tổng','Trung bình đọc từ bảng','Lãi đơn'],
  medium:['Phần trăm tăng trưởng','Chia theo tỷ lệ','Dãy số có khoảng cách tăng dần','Dãy số nhân','Đọc bảng: tăng trưởng lớn nhất','Vận tốc trung bình','Trung bình có trọng số','Tính ngược giá trước thuế','Tỷ giá chéo','Giá trị thiếu khi biết tổng','Biên lợi nhuận và markup','Điểm hòa vốn'],
  hard:['Đọc bảng: doanh thu từ thị phần','Tăng rồi giảm liên tiếp','Đổi tiền có phí','Hai dãy số xen kẽ','Trung bình thay đổi khi thêm người','Hai máy làm chung','Tăng trưởng kép','Tìm giá trị ban đầu sau hai lần đổi %','Tỷ lệ thay đổi khi bổ sung nhóm','Điểm phần trăm và phần trăm','Chi phí trên mỗi đơn vị']};
// Kỹ năng của các câu Critical Thinking có sẵn từ đầu (chưa có nhãn [..] trong đề), theo thứ tự trong CRIT.
const CRIT_OLD_TAGS={
  easy:['Deduction','Deduction','Recognition of assumptions','Deduction','Evaluation of arguments','Ordering'],
  medium:['Deduction','Recognition of assumptions','Evaluation of arguments','Ordering','Deduction','Interpretation'],
  hard:['Deduction','Deduction','Recognition of assumptions','Evaluation of arguments','Deduction','Evaluation of arguments']};
const CRIT_TAG_VI={'Deduction':'Suy diễn','Recognition of assumptions':'Nhận ra giả định','Inference':'Suy luận','Interpretation':'Diễn giải','Evaluation of arguments':'Đánh giá lập luận','Ordering':'Xếp thứ tự'};
const LVS=['easy','medium','hard'];

function bankGroups(key){
  if(key==='num')return LVS.flatMap(lv=>NUM[lv].map((f,i)=>({name:NUM_NAMES[lv][i]||`Dạng ${i+1}`,lv,gen:()=>({...f(),type:'num',level:lv})})));
  if(key==='abs'){
    const S=(name,lv,rules)=>({name,lv,gen:()=>({...genSeries(lv,rules),type:'abs',level:lv})});
    const G=(name,lv,fn)=>({name,lv,gen:()=>({...fn(),type:'abs',level:lv})});
    return[S('Dãy hình: xoay','easy',['rot']),S('Dãy hình: số cạnh','easy',['sides']),S('Dãy hình: tô màu','easy',['fill']),S('Dãy hình: số chấm','easy',['dots']),
      S('Dãy hình: vị trí ô vuông nhỏ','easy',['corner']),S('Dãy hình: kích thước','easy',['size']),S('Dãy hình: nét liền và nét đứt','easy',['dash']),
      G('Tìm hình khác loại: số cạnh','easy',()=>genOdd('easy','sides')),
      S('Dãy hình: kết hợp 2 quy luật','medium',null),G('Ma trận 3×3: quy luật hàng và cột','medium',()=>genMatrix('medium')),
      G('Chồng hình: gộp tất cả nét','medium',()=>genOverlay('medium')),G('Tìm hình khác loại: số chấm theo số cạnh','medium',()=>genOdd('medium','dotsides')),
      S('Dãy hình: kết hợp 3 quy luật','hard',null),G('Hai chuỗi xen kẽ','hard',()=>genAlt()),G('Ma trận 3×3 kiểu Raven','hard',()=>genMatrix('hard')),
      G('Chồng hình: nét trùng thì mất','hard',()=>genOverlay('hard')),G('Tìm hình khác loại: hướng mũi tên','hard',()=>genOdd('hard','point'))];
  }
  if(key==='verb')return LVS.map(lv=>({name:`Đoạn văn mức ${LEVELS[lv].toLowerCase()}`,lv,passages:VERB[lv]}));
  // crit: câu cố định gộp theo kỹ năng, rồi tới các dạng sinh ngẫu nhiên
  const by={};
  LVS.forEach(lv=>CRIT[lv].forEach((c,i)=>{const m=c.q.match(/^\[(.+?)\]/),tag=m?m[1]:CRIT_OLD_TAGS[lv][i]||'Deduction';
    (by[tag]=by[tag]||[]).push({type:'crit',q:c.q,opts:c.o,ans:c.a,exp:c.e,level:lv})}));
  const fixed=Object.keys(CRIT_TAG_VI).filter(t=>by[t]).map(t=>({name:CRIT_TAG_VI[t]+(t==='Ordering'?'':` (${t})`),items:by[t]}));
  const C=(name,lv,k)=>({name,lv,gen:()=>genCrit(lv,k)});
  return[...fixed,C('Xếp thứ tự 3 người','easy','order'),C('Xếp thứ tự 4 người','medium','order'),C('Xếp thứ tự 5 người','hard','order'),
    C('Tam đoạn luận: All … are …','easy','allA'),C('Tam đoạn luận: Some … All …','medium','someAll'),C('Tam đoạn luận: No … Some …','hard','noSome'),
    C('Nếu… thì…: điều kiện xảy ra','easy','mp'),C('Nếu… thì…: kết quả không xảy ra','medium','mt'),
    C('Nếu… thì…: lỗi khẳng định hệ quả','hard','ac'),C('Nếu… thì…: lỗi phủ định tiền đề','hard','da')];
}
function ansCard(q,head){
  const ans=j=>j===q.ans?' class="is-ans"':'',em=j=>j===q.ans?'<em>Đáp án đúng</em>':'';
  let body;
  if(q.type==='abs')body=`<p style="margin:0 0 8px"><b>${ABS_TEXT[q.form]||'Which figure comes next?'}</b></p><div class="mini">${absStem(q)}</div><ul class="ro abs">${q.opts.map((o,j)=>`<li${ans(j)}><span class="k">${'ABCD'[j]}</span><div class="panel">${panelSVG(o)}</div>${em(j)}</li>`).join('')}</ul>`;
  else body=`<p style="margin:0"><b>${esc(q.q)}</b></p>`+(q.table?`<div class="tablewrap" style="margin-top:10px"><table class="data"><thead><tr>${q.table.head.map(x=>`<th>${esc(x)}</th>`).join('')}</tr></thead><tbody>${q.table.rows.map(r=>`<tr>${r.map(x=>`<td>${esc(x)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`:'')
    +`<ul class="ro">${q.opts.map((o,j)=>`<li${ans(j)}><span class="k">${'ABCD'[j]}</span><span>${esc(o)}</span>${em(j)}</li>`).join('')}</ul>`;
  return`<article class="qcard st-ok"><div class="qhead"><span>${head}</span><span class="res ok">Đáp án: ${'ABCD'[q.ans]}</span></div>${body}<div class="why"><p><b>Giải thích:</b> ${esc(q.exp)}</p></div></article>`;
}
function passageCard(p,lv,i){
  const cls={True:'t',False:'f','Cannot say':'c'};
  return`<article class="qcard st-ok"><div class="qhead"><span>Đoạn ${i+1} · ${LEVELS[lv]}</span><span class="res ok">${p.s.length} câu</span></div>
    <div class="mini"><div class="passage">${esc(p.p)}</div></div>
    <ol class="vlist">${p.s.map(([st,a,e])=>`<li><p><b>${esc(st)}</b> <span class="vans v-${cls[a]}">${a}</span></p><p class="muted">${esc(e)}</p></li>`).join('')}</ol></article>`;
}
function studyView(lv,secKey){
  clearInterval(tick);document.onkeydown=null;run=null;
  if(lv!=='mixed')level=lv;
  const view={lv:LVS.includes(lv)?lv:'all'},d=secDef(secKey),N=3;
  const groups=bankGroups(secKey),examples=new Map();
  const items=g=>g.items?g.items.filter(q=>view.lv==='all'||q.level===view.lv):null;
  const visible=g=>g.items?items(g).length>0:view.lv==='all'||g.lv===view.lv;
  const count=g=>g.passages?`${g.passages.length} đoạn văn · ${g.passages.reduce((a,p)=>a+p.s.length,0)} câu`:g.items?`${items(g).length} câu`:`${LEVELS[g.lv]} · sinh ngẫu nhiên`;
  const body=(g,k)=>{
    if(g.passages)return g.passages.map((p,i)=>passageCard(p,g.lv,i)).join('');
    if(g.items)return items(g).map((q,i)=>ansCard(q,`Câu ${i+1} · ${LEVELS[q.level]}`)).join('');
    if(!examples.has(k))examples.set(k,Array.from({length:N},g.gen));
    return examples.get(k).map((q,i)=>ansCard(q,`Ví dụ ${i+1} · ${LEVELS[g.lv]}`)).join('')+`<button class="btn ghost small" data-more="${k}">Ví dụ khác</button>`;
  };
  const draw=()=>{
    const vis=groups.map((g,k)=>({g,k})).filter(x=>visible(x.g));
    const fixedN=vis.reduce((a,{g})=>a+(g.passages?g.passages.reduce((s,p)=>s+p.s.length,0):g.items?items(g).length:0),0);
    app.innerHTML=`
    <header class="hero" style="padding-bottom:10px">
      <h1 style="font-size:clamp(2rem,5vw,2.8rem)">Xem đề và đáp án</h1>
      <p class="lead">Câu hỏi kèm đáp án và giải thích, xếp theo từng dạng. ${secKey==='num'||secKey==='abs'?'Phần này sinh số liệu và hình ngẫu nhiên nên mỗi dạng hiện 3 ví dụ; bấm "Ví dụ khác" để xem thêm.':secKey==='verb'?'Đây là toàn bộ đoạn văn trong ngân hàng đề.':'Gồm toàn bộ câu cố định, xếp theo kỹ năng, và các dạng sinh ngẫu nhiên.'}</p>
    </header>
    <div class="controls" style="margin-top:6px">
      <div class="chips" role="group" aria-label="Chọn phần">${SECTIONS.map(s=>`<button data-sec="${s.key}" aria-pressed="${s.key===secKey}">${s.name}</button>`).join('')}</div>
      <div class="chips" role="group" aria-label="Mức độ"><button data-blv="all" aria-pressed="${view.lv==='all'}">Mọi mức độ</button>${LVS.map(k=>`<button data-blv="${k}" aria-pressed="${view.lv===k}">${LEVELS[k]}</button>`).join('')}</div>
    </div>
    <p class="muted" style="margin:14px 0 0">${d.name}: ${vis.length} dạng${fixedN?`, ${fixedN} câu cố định`:''}. ${TIPS[secKey]}</p>
    <ul class="gtoc" style="margin-top:12px">${vis.map(({g,k})=>`<li><a href="#b-${k}" data-bjump="b-${k}">${g.name}</a> <span class="muted" style="font-size:.88rem">(${count(g)})</span></li>`).join('')}</ul>
    ${vis.map(({g,k})=>`<section class="gsec" id="b-${k}"><h2 style="font-size:1.35rem">${g.name}</h2><p class="muted" style="margin-top:2px">${count(g)}</p><div id="bb-${k}">${body(g,k)}</div></section>`).join('')}
    <div class="row section-gap"><button class="btn" id="try">Luyện riêng ${d.name}</button><button class="btn ghost" data-home>Về trang chính</button></div>`;
    app.querySelectorAll('[data-sec]').forEach(b=>b.onclick=()=>studyView(view.lv==='all'?'mixed':view.lv,b.dataset.sec));
    app.querySelectorAll('[data-blv]').forEach(b=>b.onclick=()=>{view.lv=b.dataset.blv;draw()});
    app.querySelectorAll('[data-bjump]').forEach(a=>a.onclick=e=>{e.preventDefault();document.getElementById(a.dataset.bjump).scrollIntoView({behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth'})});
    bindMore();
    document.getElementById('try').onclick=()=>start([{def:d,qs:build(d,view.lv==='all'?'mixed':view.lv),secs:d.minutes*60}],'Luyện '+d.name);
  };
  const bindMore=()=>app.querySelectorAll('[data-more]').forEach(b=>b.onclick=()=>{const k=+b.dataset.more;examples.delete(k);
    document.getElementById('bb-'+k).innerHTML=body(groups[k],k);bindMore()});
  draw();window.scrollTo(0,0);
}

initAttempts().finally(()=>{backfillUploads();home();syncPending()});
addEventListener('online',()=>syncPending());
</script>
